
[workspace]
members = [
  "packages/rs/core",
  "packages/rs/google",
  "packages/rs/lakebase-proxy",
  "packages/rs/model",
  "packages/rs/model-proxy",
  "packages/rs/service"
]
default-members = [
  "packages/rs/lakebase-proxy",
  "packages/rs/model-proxy",
  "packages/rs/service"
]
resolver = "2"

  [workspace.package]
  version = "0.9.22"
  edition = "2021"
  rust-version = "1.90"
  license = "Apache-2.0"
  repository = "https://github.com/reggie-db/dbx-tools"

  [workspace.dependencies]
  async-trait = "0.1"
  async-stream = "0.3"
  async-graphql = "=7.0.17"
  async-graphql-axum = "=7.0.17"
  auto-launcher = "=1.1.0"
  axum = "0.8"
  base64 = "0.22"
  bytes = "1"
  configparser = "3"
  directories = "6"
  difflib-fast = "0.3.5"
  fs4 = "0.13"
  futures = "0.3"
  google-cloud-auth = "=0.18.0"
  hdrhistogram = "7"
  http = "1"
  httpdate = "1"
  mini-moka = "0.10"
  metrics = "0.24"
  mime_guess = "2"
  open = "5"
  percent-encoding = "2"
  regex = "1"
  rcgen = "0.14"
  rustls = "0.23"
  rusqlite_migration = "=2.5.0"
  scraper = "0.24"
  schemars = "=0.9.0"
  serde_json = "1"
  serde_yaml = "=0.9.34"
  service-manager = "=0.11.0"
  sha2 = "0.10"
  sysinfo = "0.37"
  tempfile = "3"
  thiserror = "2"
  tokenx-rs = "=0.1.0"
  tokio-postgres = "0.7"
  tokio-rustls = "0.26"
  tracing = "0.1"
  ts-rs = "=12.0.1"
  webpki-roots = "1"
  wiremock = "0.6"

    [workspace.dependencies.aide]
    version = "=0.15.1"
    default-features = false
    features = [ "axum", "axum-json", "axum-query", "axum-tokio", "scalar" ]

    [workspace.dependencies.axum-typed-routing]
    version = "=0.4.7"
    features = [ "aide" ]

    [workspace.dependencies.backon]
    version = "=1.6.0"
    default-features = false
    features = [ "tokio-sleep" ]

    [workspace.dependencies.clap]
    version = "4.6"
    features = [ "derive", "env" ]

    [workspace.dependencies.image]
    version = "0.25"
    default-features = false
    features = [ "jpeg", "png", "webp" ]

    [workspace.dependencies.openssl-sys]
    version = "0.9"
    features = [ "vendored" ]

    [workspace.dependencies.oauth2]
    version = "5"
    default-features = false
    features = [ "reqwest", "rustls-tls" ]

    [workspace.dependencies.pgwire]
    version = "=0.41.0"
    default-features = false
    features = [ "client-api-ring", "server-api-ring" ]

    [workspace.dependencies.reqwest]
    version = "0.12"
    default-features = false
    features = [ "json", "rustls-tls" ]

    [workspace.dependencies.reqwest-middleware]
    version = "=0.4.2"
    features = [ "json" ]

    [workspace.dependencies.rusqlite]
    version = "=0.39.0"
    features = [ "bundled" ]

    [workspace.dependencies.serde]
    version = "1"
    features = [ "derive" ]

    [workspace.dependencies.time]
    version = "0.3"
    features = [ "serde", "formatting", "parsing" ]

    [workspace.dependencies.tokio]
    version = "1"
    features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time"
]

    [workspace.dependencies.tokio-util]
    version = "0.7"
    features = [ "codec" ]

    [workspace.dependencies.tracing-subscriber]
    version = "0.3"
    features = [ "env-filter" ]

    [workspace.dependencies.uniffi]
    version = "=0.31"
    features = [ "tokio" ]

    [workspace.dependencies.url]
    version = "2"
    features = [ "serde" ]

    [workspace.dependencies.uuid]
    version = "1"
    features = [ "v4" ]
