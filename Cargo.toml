[workspace]
members = ["packages/rs/databricks-auth"]
default-members = []
resolver = "2"

[workspace.package]
version = "0.6.165"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/reggie-db/dbx-tools"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
configparser = "3"
directories = "6"
fs4 = "0.13"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uniffi = { version = "=0.31", features = ["cli", "tokio"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }