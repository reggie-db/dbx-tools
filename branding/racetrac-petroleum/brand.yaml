schemaVersion: "1"
name: RaceTrac
shortName: RaceTrac
tagline: Whatever Gets You Going
description: RaceTrac is a convenience-store and fuel-retail brand offering
  fuel, coffee, drinks, snacks, prepared food, and rewards for everyday stops
  and travel.
assets:
  icon:
    light: https://www.racetrac.com/favicon.ico
  logo:
    light: https://www.racetrac.com/4ad8c1/globalassets/favicon.ico
  favicon: https://www.racetrac.com/favicon.ico
colors:
  primary: "#CF271B"
  primaryHover: "#b52217"
  accent: "#012169"
  foreground: "#012169"
  background: "#ffffff"
  surface: "#ececec"
  muted: "#555555"
  border: "#767676"
typography:
  sans: '"Nunito Sans", "Myriad Pro", sans-serif'
  mono: monospace
voice:
  audience:
    - Commuters and travelers
    - Customers seeking convenient fuel, food, and drinks
    - RaceTrac Rewards members
    - Small-business and fleet customers
    - Prospective employees
  tone:
    - Friendly
    - Energetic
    - Informal
    - Lightly playful
    - Benefit-focused
  principles:
    - Lead with convenience, cravings, or everyday value.
    - Use short headlines and direct calls to action.
    - Address customers naturally with everyday language.
    - Use light wordplay without obscuring the message.
    - Keep rewards instructions and offer terms clear.
    - Preserve the RaceTrac spelling and capitalization.
  avoid:
    - Petroleum-industry jargon in consumer copy
    - Formal, impersonal corporate language
    - Wordplay that obscures practical information
    - Unqualified savings or availability claims
    - Treating Learning-team guidance as company-wide policy
links:
  website: https://www.racetrac.com/
  documentation: https://www.racetrac.com/
extensions: {}
