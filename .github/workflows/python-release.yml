name: python-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Python package version to build
        type: string
        required: true
      publish:
        description: Upload the validated distributions to PyPI
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Stamp workspace versions
        env:
          VERSION: ${{ inputs.version }}
        run: |-
          chmod -R u+w packages/py
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["VERSION"]
          package_files = sorted(Path("packages/py").glob("*/pyproject.toml"))
          packages = {}
          for path in package_files:
              source = path.read_text(encoding="utf-8")
              name = re.search(r'^name = "([^"]+)"$', source, re.MULTILINE)
              if name is None:
                  raise ValueError(f"Missing project name in {path}")
              packages[name.group(1)] = path.parent.name

          for path in package_files:
              source = path.read_text(encoding="utf-8")
              source, count = re.subn(
                  r'^version = "[^"]+"$',
                  f'version = "{version}"',
                  source,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise ValueError(f"Expected one project version in {path}")
              for name, directory in packages.items():
                  source = re.sub(
                      rf'{re.escape(name)} @ git\+[^" ]+#subdirectory=packages/py/{re.escape(directory)}',
                      f"{name}=={version}",
                      source,
                  )
              path.write_text(source, encoding="utf-8")
          PY
      - name: Build distributions
        run: uv build --all-packages
      - name: Validate distributions
        run: |-
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6
          uvx twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist
    timeout-minutes: 20
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/
    if: ${{ inputs.publish }}
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
    timeout-minutes: 10
permissions:
  contents: read
