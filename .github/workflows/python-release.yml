name: python-release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package during a dry run
        type: string
        required: true
      expected_sha:
        description: Commit the release tag must reference
        type: string
        required: true
  repository_dispatch:
    types:
      - release
concurrency:
  group: python-release
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
          EXPECTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
        run: |-
          test -n "$RELEASE_TAG"
          test -n "$EXPECTED_SHA"
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v7
      - name: Require Rust artifact handoff
        id: require_rust_artifact_handoff
        if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_run' }}
        env:
          RUST_RUN_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.rust_run_id || github.event.workflow_run.id }}
          RUST_RUN_ATTEMPT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.rust_run_attempt || github.event.workflow_run.run_attempt }}
        run: |-
          test -n "$RUST_RUN_ID"
          test -n "$RUST_RUN_ATTEMPT"
        shell: bash
      - name: Download dbx-tools-auth native wheels
        id: download_dbx-tools-auth_native_wheels
        if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-auth--*--python-wheel
          path: dist/auth
          merge-multiple: true
          run-id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.rust_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download dbx-tools-databricks native wheels
        id: download_dbx-tools-databricks_native_wheels
        if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-databricks--*--python-wheel
          path: dist/databricks
          merge-multiple: true
          run-id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.rust_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download dbx-tools-databricks-auth native wheels
        id: download_dbx-tools-databricks-auth_native_wheels
        if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-databricks-auth--*--python-wheel
          path: dist/databricks-auth
          merge-multiple: true
          run-id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.rust_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download dbx-tools-google-auth native wheels
        id: download_dbx-tools-google-auth_native_wheels
        if: ${{ github.event_name == 'repository_dispatch' || github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-google-auth--*--python-wheel
          path: dist/google-auth
          merge-multiple: true
          run-id: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.rust_run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Stamp workspace versions
        id: stamp_workspace_versions
        env:
          VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
        run: |-
          chmod -R u+w packages/py
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["VERSION"].removeprefix("v")
          package_files = sorted(Path("packages/py").glob("*/pyproject.toml"))
          packages = {}
          for path in package_files:
              source = path.read_text(encoding="utf-8")
              name = re.search(r'^name = "([^"]+)"$', source, re.MULTILINE)
              if name is None:
                  raise ValueError(f"Missing project name in {path}")
              packages[name.group(1)] = path.parent.name

          for path in package_files:
              source = path.read_text(encoding="utf-8")
              source, count = re.subn(
                  r'^version = "[^"]+"$',
                  f'version = "{version}"',
                  source,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise ValueError(f"Expected one project version in {path}")
              for name, directory in packages.items():
                  source = re.sub(
                      rf'{re.escape(name)} @ git\+[^" ]+#subdirectory=packages/py/{re.escape(directory)}',
                      f"{name}=={version}",
                      source,
                  )
              path.write_text(source, encoding="utf-8")
          PY
          mkdir -p .release
          printf "%s\n" "$VERSION" > .release/tag
          git rev-parse HEAD > .release/sha
      - name: Build distributions
        id: build_distributions
        run: |-
          uv build --package dbx-tools-core --out-dir dist/core
          uv build --package dbx-tools-postgres --out-dir dist/postgres
          uv build --package dbx-tools-model --out-dir dist/model
          uv build --package dbx-tools-litellm --out-dir dist/litellm
          uv build --package dbx-tools-graphiti --out-dir dist/graphiti
      - name: Validate distributions
        id: validate_distributions
        run: |-
          test "$(find dist/core -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          test "$(find dist/postgres -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          test "$(find dist/model -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          test "$(find dist/litellm -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          test "$(find dist/graphiti -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then find dist/auth -maxdepth 1 -name '*.whl' -print -quit | grep -q .; fi
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then find dist/databricks -maxdepth 1 -name '*.whl' -print -quit | grep -q .; fi
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then find dist/databricks-auth -maxdepth 1 -name '*.whl' -print -quit | grep -q .; fi
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ] || [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then find dist/google-auth -maxdepth 1 -name '*.whl' -print -quit | grep -q .; fi
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 | xargs -0 uvx twine check
      - name: Upload distributions
        id: upload_distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist
      - name: Upload release metadata
        id: upload_release_metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: .release
    timeout-minutes: 20
  publish-core:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-dbx-tools-core
      url: https://pypi.org/project/dbx-tools-core/
    if: ${{ github.event_name == 'repository_dispatch' }}
    steps:
      - name: Download distributions
        id: download_distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish dbx-tools-core to PyPI
        id: publish_dbx-tools-core_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core
    timeout-minutes: 10
  publish-postgres:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-dbx-tools-postgres
      url: https://pypi.org/project/dbx-tools-postgres/
    if: ${{ github.event_name == 'repository_dispatch' }}
