# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: release-request
run-name: "merge release request #${{ inputs.pull_request }}"
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Source pull request to merge
        type: string
        required: true
      base_branch:
        description: Release branch receiving the source pull request
        type: string
        default: main
        required: true
concurrency:
  group: release-request-${{ inputs.pull_request }}
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Merge source and start release
        id: merge_source_and_start_release
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ inputs.pull_request }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |-
          gh pr merge "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --merge
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$BASE_BRANCH" -f automatic=true
        shell: bash
permissions:
  contents: read
