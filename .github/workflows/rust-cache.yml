# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: rust-cache
on:
  push:
    branches:
      - main
    paths:
      - .cargo/**
      - .github/workflows/rust-cache.yml
      - Cargo.lock
      - Cargo.toml
      - packages/rs/**
  workflow_dispatch: {}
concurrency:
  group: rust-cache
  cancel-in-progress: true
jobs:
  prime:
    name: ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
      - name: Setup Rust
        id: setup_rust
        if: ${{ matrix.os != 'win32' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo }}
      - name: Verify preinstalled Windows Rust
        id: verify_preinstalled_windows_rust
        if: ${{ matrix.os == 'win32' }}
        run: |-
          rustc --version --verbose
          cargo --version
          rustup target list --installed | grep -Fx "${{ matrix.cargo }}"
          test -f "$(rustc --print sysroot)/lib/rustlib/${{ matrix.cargo }}/bin/rust-lld.exe"
        shell: bash
      - name: Cache Cargo registry and targets
        id: cargo_cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: true
          cache-workspace-crates: false
          add-job-id-key: false
          add-rust-environment-hash-key: true
          shared-key: release-${{ matrix.cargo }}-rust-stable
          save-if: true
      - name: Install Linux native dependencies
        id: install_linux_native_dependencies
        if: ${{ matrix.os == 'linux' }}
        run: |-
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Prime Cargo target cache
        id: prime_cargo_target_cache
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ matrix.os == 'win32' && 'rust-lld' || '' }}
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=rust_cache duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          cargo build --release --workspace --locked --target "${{ matrix.cargo }}" ${{ matrix.cargoExcludes }}
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            cargo: x86_64-unknown-linux-gnu
            node: linux-x64-gnu
            python: manylinux_2_35_x86_64
            os: linux
            cpu: x64
            libc: glibc
            cargoExcludes: ""
          - runner: ubuntu-24.04-arm
            cargo: aarch64-unknown-linux-gnu
            node: linux-arm64-gnu
            python: manylinux_2_39_aarch64
            os: linux
            cpu: arm64
            libc: glibc
            cargoExcludes: ""
          - runner: macos-15-intel
            cargo: x86_64-apple-darwin
            node: darwin-x64
            python: macosx_13_0_x86_64
            os: darwin
            cpu: x64
            cargoExcludes: ""
          - runner: macos-14
            cargo: aarch64-apple-darwin
            node: darwin-arm64
            python: macosx_11_0_arm64
            os: darwin
            cpu: arm64
            cargoExcludes: ""
          - runner: windows-latest
            cargo: x86_64-pc-windows-msvc
            node: win32-x64-msvc
            python: win_amd64
            os: win32
            cpu: x64
            cargoExcludes: --exclude dbx-tools-lakebase-proxy
          - runner: windows-11-vs2026-arm
            cargo: aarch64-pc-windows-msvc
            node: win32-arm64-msvc
            python: win_arm64
            os: win32
            cpu: arm64
            cargoExcludes: --exclude dbx-tools-lakebase-proxy
