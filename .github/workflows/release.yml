        shell: bash
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        id: install_dependencies
        run: bun install
      - name: Validate public source documentation
        id: validate_public_source_documentation
        run: bun docs/scripts/check-source-docs.mjs
      - name: Generate docs from READMEs
        id: generate_docs_from_readmes
        run: bun docs/scripts/sync-readmes.mjs
      - name: Install docs dependencies
        id: install_docs_dependencies
        run: bun install --cwd .docs-build/site
      - name: Save Bun cache
        id: save_bun_cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Generate API docs
        id: generate_api_docs
        run: bun docs/scripts/generate-api-docs.mjs
      - name: Check generated titles
        id: check_generated_titles
        run: bun docs/scripts/check-generated-titles.mjs
      - name: Build docs
        id: build_docs
        run: bun run --cwd .docs-build/site build
      - name: Check generated links
        id: check_generated_links
        run: bun run --cwd .docs-build/site check-links
      - name: Upload Pages artifact
        id: upload_pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-build/dist
    timeout-minutes: 30
  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ success() }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    timeout-minutes: 15
  build-python:
    needs: verify-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUN_VERSION: 1.3.14
    if: ${{ always() && (needs.verify-context.result == 'success') }}
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v7
      - name: Install release helpers
        id: install_release_helpers
        run: bun install
      - name: Save Bun cache
        id: save_bun_cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Download approved Python distributions
        id: download_approved_python_distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
        run: |-
          rm -rf dist/release-download
          mkdir -p dist/release-download
          gh release download "$RELEASE_TAG" --pattern release-manifest.json --pattern SHA256SUMS --pattern "*.whl" --pattern "*.tar.gz" --dir dist/release-download
      - name: Select dbx-tools-models distributions
        id: select_dbx-tools-models_distributions
