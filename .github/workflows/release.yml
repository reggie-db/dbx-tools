# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: release
run-name: release ${{ github.ref_name }}
on:
  push:
    tags:
      - v*
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      expected_sha: ${{ steps.release.outputs.expected_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
      npm: ${{ steps.release.outputs.npm }}
      pypi: ${{ steps.release.outputs.pypi }}
      docs: ${{ steps.release.outputs.docs }}
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
      DOCS_SITE_URL: https://docs.dbx.tools
      DOCS_BASE: /
    steps:
      - name: Checkout release source
        id: checkout_release_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        id: install_dependencies
        run: bun install --frozen-lockfile
      - name: Verify release context
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |-
          case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
          RELEASE_VERSION="${RELEASE_TAG#v}"
          bun node_modules/@dbx-tools/projen/tasks/release-version.ts --version "$RELEASE_VERSION"
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          RELEASE_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "origin/main")" = "$RELEASE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          bun node_modules/@dbx-tools/projen/tasks/release-options.ts --tag "$RELEASE_TAG" --output "$GITHUB_OUTPUT"
        shell: bash
      - name: Setup Python
        id: setup_python
        if: ${{ steps.release.outputs.validation == 'true' || steps.release.outputs.docs == 'true' || steps.release.outputs.pypi == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install CLI documentation parser
        id: install_cli_documentation_parser
        if: ${{ steps.release.outputs.validation == 'true' || steps.release.outputs.docs == 'true' }}
        run: python -m pip install -r docs/requirements.txt
      - name: Setup validation uv
        id: setup_validation_uv
        if: ${{ steps.release.outputs.validation == 'true' || steps.release.outputs.pypi == 'true' }}
        uses: astral-sh/setup-uv@v7
      - name: Validate docs:check-source
        id: validate_docs_check-source
        if: ${{ success() && steps.release.outputs.validation == 'true' }}
        run: bun run docs:check-source
      - name: Validate docs:check-readmes
        id: validate_docs_check-readmes
        if: ${{ success() && steps.release.outputs.validation == 'true' }}
        run: bun run docs:check-readmes
      - name: Validate py:lint
        id: validate_py_lint
        if: ${{ success() && steps.release.outputs.validation == 'true' }}
        run: bun run py:lint
      - name: Validate py:test
        id: validate_py_test
        if: ${{ success() && steps.release.outputs.validation == 'true' }}
        run: bun run py:test
      - name: Build npm archives
        id: build_npm_archives
        if: ${{ success() && steps.release.outputs.npm == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |-
          bun run compile
          bun node_modules/@dbx-tools/projen/tasks/publish.ts "$RELEASE_VERSION" --skip-compile --output .release/npm
          bun build node_modules/@dbx-tools/projen/tasks/publish-npm.ts --target=bun --outfile=.release/npm/publish-npm.mjs
      - name: Upload npm archives
        id: upload_npm_archives
        if: ${{ success() && steps.release.outputs.npm == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-npm
          path: .release/npm
          if-no-files-found: error
      - name: Configure Pages
        id: configure_pages
        if: ${{ success() && steps.release.outputs.docs == 'true' }}
        uses: actions/configure-pages@v5
      - name: Generate docs from READMEs
        id: generate_docs_from_readmes
        if: ${{ success() && steps.release.outputs.docs == 'true' }}
        run: bun docs/scripts/sync-readmes.mjs
      - name: Install docs dependencies
        id: install_docs_dependencies
        if: ${{ success() && steps.release.outputs.docs == 'true' }}
        run: bun install --cwd .docs-build/site
      - name: Generate API docs
        id: generate_api_docs
        if: ${{ success() && steps.release.outputs.docs == 'true' }}
        run: bun docs/scripts/generate-api-docs.mjs
      - name: Check generated titles
        id: check_generated_titles
        if: ${{ success() && steps.release.outputs.docs == 'true' }}
        run: bun docs/scripts/check-generated-titles.mjs
      - name: Build docs
        id: build_docs
        if: ${{ success() && steps.release.outputs.docs == 'true' }}
        run: bun run --cwd .docs-build/site build
      - name: Check generated links
        id: check_generated_links
        if: ${{ success() && steps.release.outputs.docs == 'true' }}
        run: bun run --cwd .docs-build/site check-links
      - name: Upload Pages artifact
        id: upload_pages_artifact
        if: ${{ success() && steps.release.outputs.docs == 'true' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-build/dist
      - name: Setup uv
        id: setup_uv
        if: ${{ success() && steps.release.outputs.pypi == 'true' }}
        uses: astral-sh/setup-uv@v7
      - name: Build Python distributions
        id: build_python_distributions
        if: ${{ success() && steps.release.outputs.pypi == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |-
          bun node_modules/@dbx-tools/projen/tasks/publish-python.ts "$RELEASE_VERSION" \
            --root "packages/py" \
            --package "graphiti" \
            --output .release/python --package-directories
      - name: Upload dbx-tools-graphiti distributions
        id: upload_dbx-tools-graphiti_distributions
        if: ${{ success() && steps.release.outputs.pypi == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-python-graphiti
          path: .release/python/graphiti
          if-no-files-found: error
    timeout-minutes: 60
  publish-node:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
    if: ${{ always() && (needs['build-release'].result == 'success') && (needs['build-release'].outputs.npm == 'true') }}
    steps:
      - name: Download npm archives
        id: download_npm_archives
        uses: actions/download-artifact@v4
        with:
          name: release-npm
          path: .release/npm
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm CLI
        id: install_npm_cli
        run: npm install --global npm@11.4.2
      - name: Publish npm workspace
        id: publish_npm_workspace
        env:
          RELEASE_VERSION: ${{ needs.build-release.outputs.release_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: bun .release/npm/publish-npm.mjs --directory .release/npm --version "$RELEASE_VERSION"
    timeout-minutes: 30
  deploy-docs:
    needs:
      - build-release
      - publish-node
      - publish-pypi-graphiti
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ always() && (needs['build-release'].result == 'success') && (needs['build-release'].outputs.docs == 'true') && (needs['publish-node'].result == 'success' || needs['publish-node'].result == 'skipped') && (needs['publish-pypi-graphiti'].result == 'success' || needs['publish-pypi-graphiti'].result == 'skipped') }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    timeout-minutes: 15
  publish-pypi-graphiti:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-dbx-tools-graphiti
      url: https://pypi.org/project/dbx-tools-graphiti/
    if: ${{ always() && (needs.build-release.result == 'success') && (needs.build-release.outputs.pypi == 'true') }}
    steps:
      - name: Download dbx-tools-graphiti distributions
        id: download_dbx-tools-graphiti_distributions
        uses: actions/download-artifact@v4
        with:
          name: release-python-graphiti
          path: dist/graphiti
      - name: Publish dbx-tools-graphiti to PyPI
        id: publish_dbx-tools-graphiti_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/graphiti
          skip-existing: true
    timeout-minutes: 10
permissions:
  contents: read
