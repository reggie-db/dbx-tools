name: release
run-name: release 0.9.19 ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag to validate
        type: string
        required: true
      stage:
        description: Published release stage to validate or recover
        type: choice
        options:
          - all
          - node
          - python
          - cargo
          - docs
        default: all
        required: true
      dry_run:
        description: Build and validate without publishing
        type: boolean
