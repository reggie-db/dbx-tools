    if: ${{ github.event_name == 'push' || (inputs.dry_run == false && (inputs.stage == 'all' || inputs.stage == 'python')) }}
    steps:
      - name: Download distributions
        id: download_distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish dbx-tools-google-auth to PyPI
        id: publish_dbx-tools-google-auth_to_pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/google-auth
          skip-existing: true
    timeout-minutes: 10
permissions:
  contents: read
