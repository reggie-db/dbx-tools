          PACKAGE_NAME: dbx-tools-models
          RELEASE_SHA: ${{ needs.verify-context.outputs.expected_sha }}
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          bun node_modules/@dbx-tools/projen/tasks/release-manifest.ts verify \
            --directory dist/release-download \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION" \
            --kind pypi \
            --package "$PACKAGE_NAME" \
            --output dist/models
      - name: Select dbx-tools-model-proxy distributions
        id: select_dbx-tools-model-proxy_distributions
        env:
          PACKAGE_NAME: dbx-tools-model-proxy
          RELEASE_SHA: ${{ needs.verify-context.outputs.expected_sha }}
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          bun node_modules/@dbx-tools/projen/tasks/release-manifest.ts verify \
            --directory dist/release-download \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION" \
            --kind pypi \
            --package "$PACKAGE_NAME" \
            --output dist/model-proxy
      - name: Select dbx-tools-core distributions
        id: select_dbx-tools-core_distributions
        env:
          PACKAGE_NAME: dbx-tools-core
          RELEASE_SHA: ${{ needs.verify-context.outputs.expected_sha }}
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          bun node_modules/@dbx-tools/projen/tasks/release-manifest.ts verify \
            --directory dist/release-download \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION" \
            --kind pypi \
            --package "$PACKAGE_NAME" \
            --output dist/core
      - name: Select dbx-tools-postgres distributions
        id: select_dbx-tools-postgres_distributions
        env:
          PACKAGE_NAME: dbx-tools-postgres
          RELEASE_SHA: ${{ needs.verify-context.outputs.expected_sha }}
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          bun node_modules/@dbx-tools/projen/tasks/release-manifest.ts verify \
            --directory dist/release-download \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION" \
            --kind pypi \
            --package "$PACKAGE_NAME" \
            --output dist/postgres
      - name: Select dbx-tools-graphiti distributions
        id: select_dbx-tools-graphiti_distributions
        env:
          PACKAGE_NAME: dbx-tools-graphiti
          RELEASE_SHA: ${{ needs.verify-context.outputs.expected_sha }}
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          bun node_modules/@dbx-tools/projen/tasks/release-manifest.ts verify \
            --directory dist/release-download \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION" \
            --kind pypi \
            --package "$PACKAGE_NAME" \
            --output dist/graphiti
      - name: Validate approved distributions
        id: validate_approved_distributions
        run: find dist/models dist/model-proxy dist/core dist/postgres dist/graphiti -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 | xargs -0 uvx twine check
      - name: Upload distributions
        id: upload_distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |-
            dist/models
            dist/model-proxy
            dist/core
            dist/postgres
            dist/graphiti
          retention-days: 7
    timeout-minutes: 20
  publish-pypi-models:
    needs:
      - verify-context
      - build-python
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-dbx-tools-models
      url: https://pypi.org/project/dbx-tools-models/
    if: ${{ always() && (needs.verify-context.result == 'success') && (needs.build-python.result == 'success') }}
    steps:
