# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: release
run-name: release ${{ github.ref_name }}
on:
  push:
    tags:
      - v*
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify-context:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      expected_sha: ${{ steps.release.outputs.expected_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
    steps:
      - name: Checkout release source
        id: checkout_release_source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v7
      - name: Install release validation dependencies
        id: install_release_validation_dependencies
        run: bun install --frozen-lockfile
      - name: Save Bun cache
        id: save_bun_cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Verify release context
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |-
          case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
          RELEASE_VERSION="${RELEASE_TAG#v}"
          bun node_modules/@dbx-tools/projen/tasks/release-version.ts --version "$RELEASE_VERSION"
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          RELEASE_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "origin/main")" = "$RELEASE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Validate docs:check-source
        id: validate_docs_check-source
        run: bun run docs:check-source
      - name: Validate docs:check-readmes
        id: validate_docs_check-readmes
        run: bun run docs:check-readmes
      - name: Build and upload release artifacts
        id: build_and_upload_release_artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.expected_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.release_version }}
        run: |-
          bun node_modules/@dbx-tools/projen/tasks/release-candidate.ts \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --python-root "packages/py" \
            --upload
          gh release edit "$RELEASE_TAG" --draft=false --latest
    timeout-minutes: 60
  publish-node:
    needs: verify-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
    if: ${{ success() }}
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm CLI
        id: install_npm_cli
        run: npm install --global npm@11.4.2
      - name: Install
        id: install
        run: bun install
      - name: Save Bun cache
        id: save_bun_cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Download approved npm archives
        id: download_approved_npm_archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify-context.outputs.expected_sha }}
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          rm -rf dist/release-download dist/npm-release
          mkdir -p dist/release-download
          gh release download "$RELEASE_TAG" --pattern release-manifest.json --pattern SHA256SUMS --pattern "*.tgz" --dir dist/release-download
          bun node_modules/@dbx-tools/projen/tasks/release-manifest.ts verify \
            --directory dist/release-download \
            --tag "$RELEASE_TAG" \
            --sha "$RELEASE_SHA" \
            --version "$RELEASE_VERSION" \
            --kind npm \
            --output dist/npm-release
        shell: bash
      - name: Publish approved npm archives
        id: publish_approved_npm_archives
        env:
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          DRY_RUN: ""
        run: bun node_modules/@dbx-tools/projen/tasks/publish-npm.ts --directory dist/npm-release --version "$RELEASE_VERSION" $DRY_RUN
    timeout-minutes: 30
  build-docs:
