          NPM_CONFIG_PROVENANCE: ${{ (github.event_name == 'release' || inputs.dry_run != true) && 'true' || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: bun node_modules/@dbx-tools/projen/tasks/publish-npm.ts --directory dist/npm-release --version "$RELEASE_VERSION" $DRY_RUN
    timeout-minutes: 30
