      - name: Check generated titles
        id: check_generated_titles
        run: bun docs/scripts/check-generated-titles.mjs
      - name: Build docs
        id: build_docs
        run: bun run --cwd .docs-build/site build
      - name: Check generated links
        id: check_generated_links
        run: bun run --cwd .docs-build/site check-links
      - name: Upload Pages artifact
        id: upload_pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-build/dist
    timeout-minutes: 30
  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    timeout-minutes: 15
  sync-release-branch:
    needs: publication-complete
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event_name == 'push' && needs.publication-complete.result == 'success' }}
    steps:
      - name: Checkout released main
        id: checkout_released_main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Safely sync dev
        id: safely_sync_dev
        env:
          SOURCE_BRANCH: dev
        run: |-
          if ! git ls-remote --exit-code --heads origin "refs/heads/$SOURCE_BRANCH" >/dev/null 2>&1; then
            echo "source branch $SOURCE_BRANCH no longer exists; nothing to sync"
            exit 0
          fi
          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH"
          if git merge-base --is-ancestor "origin/$SOURCE_BRANCH" HEAD; then
            git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          elif git merge-base --is-ancestor HEAD "origin/$SOURCE_BRANCH"; then
            echo "source branch $SOURCE_BRANCH already contains released main"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --force-create "$SOURCE_BRANCH" "origin/$SOURCE_BRANCH"
            if git merge --no-ff --no-edit "$GITHUB_SHA"; then
              git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
            else
              git merge --abort
              echo "::warning::source branch $SOURCE_BRANCH has merge conflicts with released main; leaving it untouched"
            fi
          fi
        shell: bash
permissions:
  contents: read
