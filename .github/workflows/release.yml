# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: release
run-name: release 0.9.18 ${{ github.event_name == 'push' && github.sha || inputs.release_tag }}
on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag to validate
        type: string
        required: true
      expected_sha:
        description: Commit the release tag must reference
        type: string
        required: true
      stage:
        description: Release stage to build, validate, or recover
        type: choice
        options:
          - all
          - node
          - python
          - docs
        default: all
        required: true
      source_run_id:
        description: Earlier release workflow run containing Rust artifacts
        type: string
        default: ""
        required: false
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true
        required: true
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify-context:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      expected_sha: ${{ steps.release.outputs.expected_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
      build_mode: ${{ steps.release.outputs.build_mode }}
    steps:
      - name: Checkout release source
        id: checkout_release_source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.expected_sha }}
          fetch-depth: 0
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install release validation dependencies
        id: install_release_validation_dependencies
        run: bun install --frozen-lockfile
      - name: Verify release context
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || '' }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          GH_TOKEN: ${{ github.token }}
        run: |-
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$GITHUB_REF_TYPE" = "branch"
            test "$GITHUB_REF_NAME" = "main"
            RELEASE_SHA="$GITHUB_SHA"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            RELEASE_VERSION="$(tr -d '\r\n' < VERSION)"
            bun node_modules/@dbx-tools/projen/tasks/release-version.ts --version "$RELEASE_VERSION"
            PREVIOUS_VERSION="$(git show "$RELEASE_SHA^:VERSION" | tr -d '\r\n')"
            test "$PREVIOUS_VERSION" != "$RELEASE_VERSION"
            RELEASE_TAG="v$RELEASE_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
              test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
            else
              git fetch --force --tags origin
              bun node_modules/@dbx-tools/projen/tasks/release-version.ts --version "$RELEASE_VERSION" --prefix "v" --assert-next
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "$RELEASE_TAG"
              git push origin "refs/tags/$RELEASE_TAG"
            fi
          else
            case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
            RELEASE_VERSION="${RELEASE_TAG#v}"
            bun node_modules/@dbx-tools/projen/tasks/release-version.ts --version "$RELEASE_VERSION"
            git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
            RELEASE_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
            test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
            test "$RELEASE_SHA" = "$EXPECTED_SHA"
            if [ -n "${{ inputs.source_run_id }}" ]; then
              case "${{ inputs.stage }}" in node|python) ;; *) exit 1 ;; esac
              case "${{ inputs.source_run_id }}" in *[!0-9]*|"") exit 1 ;; esac
            fi
          fi
          BUILD_MODE="$(git log -1 --format=%B -- VERSION | sed -n 's/^Release-Build: //p' | tail -1)"
          case "$BUILD_MODE" in local|remote) ;; *) BUILD_MODE="remote" ;; esac
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_mode=$BUILD_MODE" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Prepare local draft release
        id: prepare_local_draft_release
        if: ${{ steps.release.outputs.build_mode == 'local' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ steps.release.outputs.expected_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |-
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --target "$RELEASE_SHA"
          fi
      - name: Verify source artifact run
        id: verify_source_artifact_run
        if: ${{ inputs.source_run_id != '' }}
        uses: actions/github-script@v8
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |-
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.SOURCE_RUN_ID),
            });
            if (run.data.path !== ".github/workflows/release.yml") core.setFailed("Source run is not release.yml");
            if (run.data.head_sha !== process.env.EXPECTED_SHA) core.setFailed("Source run commit does not match the release tag");
  publish-node:
    needs:
      - verify-context
      - publish-native-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
    if: ${{ always() && needs.verify-context.result == 'success' && needs.publish-native-npm.result == 'success' && (github.event_name == 'push' || inputs.stage == 'all' || inputs.stage == 'node') }}
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install
        id: install
        run: bun install
      - name: Save Bun cache
        id: save_bun_cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Compile, package, and publish npm workspace
        id: compile_package_and_publish_npm_workspace
        env:
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
          NPM_CONFIG_PROVENANCE: ${{ (github.event_name == 'push' || inputs.dry_run != true) && 'true' || 'false' }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: |-
          chmod -R u+w . || true
          bun node_modules/@dbx-tools/projen/tasks/publish.ts "$RELEASE_VERSION" $DRY_RUN
    timeout-minutes: 30
  build-docs:
    needs: verify-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      BUN_VERSION: 1.3.14
      DOCS_SITE_URL: https://docs.dbx.tools
      DOCS_BASE: /
    if: ${{ github.event_name == 'push' || inputs.stage == 'all' || inputs.stage == 'docs' }}
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup Rust
        id: setup_rust
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve Rustdoc cache key
        id: rustdoc-cache-key
        run: echo "key=$(bun docs/scripts/rustdoc-cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - name: Restore Rustdoc cache
        id: rustdoc-cache
        uses: actions/cache/restore@v5
        with:
          path: .docs-build/rustdoc-target
          key: rustdoc-${{ runner.os }}-${{ steps.rustdoc-cache-key.outputs.key }}
          restore-keys: rustdoc-${{ runner.os }}-
      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        id: install_dependencies
        run: bun install
      - name: Validate public source documentation
        id: validate_public_source_documentation
        run: bun docs/scripts/check-source-docs.mjs
      - name: Generate docs from READMEs
        id: generate_docs_from_readmes
        run: bun docs/scripts/sync-readmes.mjs
      - name: Install docs dependencies
        id: install_docs_dependencies
        run: bun install --cwd .docs-build/site
      - name: Save Bun cache
        id: save_bun_cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Generate API docs
        id: generate_api_docs
        run: bun docs/scripts/generate-api-docs.mjs
      - name: Save Rustdoc cache
        id: save_rustdoc_cache
        if: ${{ steps.rustdoc-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .docs-build/rustdoc-target
          key: rustdoc-${{ runner.os }}-${{ steps.rustdoc-cache-key.outputs.key }}
      - name: Check generated titles
        id: check_generated_titles
        run: bun docs/scripts/check-generated-titles.mjs
      - name: Build docs
        id: build_docs
        run: bun run --cwd .docs-build/site build
      - name: Check generated links
        id: check_generated_links
        run: bun run --cwd .docs-build/site check-links
      - name: Upload Pages artifact
        id: upload_pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-build/dist
    timeout-minutes: 30
  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.event_name == 'push' || (inputs.dry_run != true && (inputs.stage == 'all' || inputs.stage == 'docs')) }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    timeout-minutes: 15
  rust-build:
    name: Rust / ${{ matrix.node }}
    needs: verify-context
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    if: ${{ needs.verify-context.outputs.build_mode == 'remote' && (github.event_name == 'push' || inputs.stage == 'all') }}
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Rust
        id: setup_rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo }}
      - name: Install Linux native dependencies
        id: install_linux_native_dependencies
        if: ${{ matrix.os == 'linux' }}
        run: |-
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Build Rust release outputs
        id: build_rust_release_outputs
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=rust duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          PACKAGE_ARGS=()
          FEATURE_ARGS=()
          while IFS= read -r PACKAGE; do PACKAGE="${PACKAGE%$'\r'}"; PACKAGE_ARGS+=(--package "$PACKAGE"); done < <(jq -r '.[]' <<<'${{ toJSON(matrix.packages) }}')
          while IFS= read -r FEATURE; do FEATURE="${FEATURE%$'\r'}"; FEATURE_ARGS+=(--features "$FEATURE"); done < <(jq -r '.[]' <<<'${{ toJSON(matrix.features) }}')
          cargo build --release --timings "${PACKAGE_ARGS[@]}" "${FEATURE_ARGS[@]}" --locked --target "${{ matrix.cargo }}"
        shell: bash
      - name: Package UniFFI outputs
        id: package_uniffi_outputs
        env:
          VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=uniffi_packaging duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-core" \
            --node "packages/js/node/core-rs" \
            --python "packages/py/core-rs" \
            --node-package "@dbx-tools/core-rs" \
            --python-package "dbx-tools-core-rs" \
            --python-module "dbx_tools.core_rs" \
            --cargo-target "${{ matrix.cargo }}" \
            --node-triple "${{ matrix.node }}" \
            --python-tag "${{ matrix.python }}" \
            --os "${{ matrix.os }}" \
            --cpu "${{ matrix.cpu }}" \
            --libc "${{ matrix.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-core/${{ matrix.node }}" \
            --skip-build
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-google" \
            --node "packages/js/node/google-rs" \
            --python "packages/py/google-rs" \
            --node-package "@dbx-tools/google-rs" \
            --python-package "dbx-tools-google-rs" \
            --python-module "dbx_tools.google_rs" \
            --cargo-target "${{ matrix.cargo }}" \
            --node-triple "${{ matrix.node }}" \
            --python-tag "${{ matrix.python }}" \
            --os "${{ matrix.os }}" \
            --cpu "${{ matrix.cpu }}" \
            --libc "${{ matrix.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-google/${{ matrix.node }}" \
            --skip-build
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-model" \
            --node "packages/js/node/model-rs" \
            --python "" \
            --node-package "@dbx-tools/model-rs" \
            --python-package "" \
            --python-module "undefined" \
            --cargo-target "${{ matrix.cargo }}" \
            --node-triple "${{ matrix.node }}" \
            --python-tag "${{ matrix.python }}" \
            --os "${{ matrix.os }}" \
            --cpu "${{ matrix.cpu }}" \
            --libc "${{ matrix.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-model/${{ matrix.node }}" \
            --skip-build
        shell: bash
      - name: Package release binaries
        id: package_release_binaries
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=binary_packaging duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          if [ "${{ matrix.os }}" != "win32" ]; then
            mkdir -p "dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/stage"
            SOURCE="target/${{ matrix.cargo }}/release/dbx-lakebase-proxy${{ matrix.os == 'win32' && '.exe' || '' }}"
            DESTINATION="dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/stage/dbx-lakebase-proxy${{ matrix.os == 'win32' && '.exe' || '' }}"
            cp "$SOURCE" "$DESTINATION"
            if [ "${{ matrix.os }}" = "win32" ]; then
              7z a "dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/dbx-lakebase-proxy-${{ matrix.node }}.zip" "$DESTINATION"
            else
              tar -C "dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/stage" -czf "dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/dbx-lakebase-proxy-${{ matrix.node }}.tar.gz" "dbx-lakebase-proxy"
            fi
            rm -rf "dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/stage"
          fi
          mkdir -p "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage"
          SOURCE="target/${{ matrix.cargo }}/release/dbx-model-proxy${{ matrix.os == 'win32' && '.exe' || '' }}"
          DESTINATION="dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage/dbx-model-proxy${{ matrix.os == 'win32' && '.exe' || '' }}"
          cp "$SOURCE" "$DESTINATION"
          if [ "${{ matrix.os }}" = "win32" ]; then
            7z a "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/dbx-model-proxy-${{ matrix.node }}.zip" "$DESTINATION"
          else
            tar -C "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage" -czf "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/dbx-model-proxy-${{ matrix.node }}.tar.gz" "dbx-model-proxy"
          fi
          rm -rf "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage"
          mkdir -p "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage"
          SOURCE="target/${{ matrix.cargo }}/release/dbx-model-proxy-tray${{ matrix.os == 'win32' && '.exe' || '' }}"
          DESTINATION="dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage/dbx-model-proxy-tray${{ matrix.os == 'win32' && '.exe' || '' }}"
          cp "$SOURCE" "$DESTINATION"
          if [ "${{ matrix.os }}" = "win32" ]; then
            7z a "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/dbx-model-proxy-tray-${{ matrix.node }}.zip" "$DESTINATION"
          else
            tar -C "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage" -czf "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/dbx-model-proxy-tray-${{ matrix.node }}.tar.gz" "dbx-model-proxy-tray"
          fi
          rm -rf "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage"
        shell: bash
      - name: Upload dbx-tools-core native npm package
        id: upload_dbx-tools-core_native_npm_package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-core-${{ matrix.node }}-npm
          path: dist/release/dbx-tools-core/${{ matrix.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-core Python wheel
        id: upload_dbx-tools-core_python_wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-core-rs--${{ matrix.python }}--python-wheel
          path: dist/release/dbx-tools-core/${{ matrix.node }}/python/*.whl
          retention-days: 7
      - name: Upload dbx-tools-google native npm package
        id: upload_dbx-tools-google_native_npm_package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-google-${{ matrix.node }}-npm
          path: dist/release/dbx-tools-google/${{ matrix.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-google Python wheel
        id: upload_dbx-tools-google_python_wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-google-rs--${{ matrix.python }}--python-wheel
          path: dist/release/dbx-tools-google/${{ matrix.node }}/python/*.whl
          retention-days: 7
      - name: Upload dbx-tools-model native npm package
        id: upload_dbx-tools-model_native_npm_package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-model-${{ matrix.node }}-npm
          path: dist/release/dbx-tools-model/${{ matrix.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-lakebase-proxy release binary
        id: upload_dbx-tools-lakebase-proxy_release_binary
        if: ${{ matrix.os != 'win32' }}
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-lakebase-proxy-${{ matrix.node }}-binary
          path: dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/*
          retention-days: 7
      - name: Upload dbx-tools-model-proxy release binary
        id: upload_dbx-tools-model-proxy_release_binary
