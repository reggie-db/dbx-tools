# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: release
run-name: release ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag to validate
        type: string
        required: true
      expected_sha:
        description: Commit the release tag must reference
        type: string
        required: true
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true
        required: true
concurrency:
  group: release
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-context:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      expected_sha: ${{ steps.release.outputs.expected_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release context
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |-
          case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          RELEASE_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$DRY_RUN" = "true"
            test "$RELEASE_SHA" = "$EXPECTED_SHA"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
  publish-node:
    needs:
      - verify-context
      - publish-native-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        shell: bash
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install
        run: bun install
      - name: Save Bun cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Compile, package, and publish npm workspace
        env:
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: ${{ github.event_name == 'push' && 'true' || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
        run: |-
          chmod -R u+w . || true
          bun node_modules/@dbx-tools/projen/tasks/publish.ts "$RELEASE_VERSION" $DRY_RUN
  build-docs:
    needs:
      - verify-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 30
    env:
      BUN_VERSION: 1.3.14
      DOCS_SITE_URL: https://docs.dbx.tools
      DOCS_BASE: /
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        shell: bash
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install
      - name: Generate docs from READMEs
        run: bun docs/scripts/sync-readmes.mjs
      - name: Check generated titles
        run: bun docs/scripts/check-generated-titles.mjs
      - name: Install docs dependencies
        run: bun install --cwd .docs-build/site
      - name: Save Bun cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Generate TypeScript API docs
        run: bun docs/scripts/generate-api-docs.mjs
      - name: Build docs
        run: bun run --cwd .docs-build/site build
      - name: Check generated links
        run: bun run --cwd .docs-build/site check-links
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-build/dist
  deploy-docs:
    if: ${{ github.event_name == 'push' }}
    needs:
      - build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  rust-build:
    name: ${{ matrix.target.node }}
    needs:
      - verify-context
    runs-on: ${{ matrix.target.runner }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: release-${{ matrix.target.cargo }}-rust-stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - target:
              runner: ubuntu-22.04
              cargo: x86_64-unknown-linux-gnu
              node: linux-x64-gnu
              python: manylinux_2_35_x86_64
              os: linux
              cpu: x64
              libc: glibc
          - target:
              runner: ubuntu-24.04-arm
              cargo: aarch64-unknown-linux-gnu
              node: linux-arm64-gnu
              python: manylinux_2_39_aarch64
              os: linux
              cpu: arm64
              libc: glibc
          - target:
              runner: macos-15-intel
              cargo: x86_64-apple-darwin
              node: darwin-x64
              python: macosx_13_0_x86_64
              os: darwin
              cpu: x64
          - target:
              runner: macos-14
              cargo: aarch64-apple-darwin
              node: darwin-arm64
              python: macosx_11_0_arm64
              os: darwin
              cpu: arm64
          - target:
              runner: windows-latest
              cargo: x86_64-pc-windows-msvc
              node: win32-x64-msvc
              python: win_amd64
              os: win32
              cpu: x64
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Rust
        if: ${{ matrix.target.os != 'win32' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.cargo }}
      - name: Verify preinstalled Windows Rust
        if: ${{ matrix.target.os == 'win32' }}
        shell: bash
        run: |-
          rustc --version --verbose
          cargo --version
          rustup target list --installed | grep -Fx "${{ matrix.target.cargo }}"
          test -f "$(rustc --print sysroot)/lib/rustlib/${{ matrix.target.cargo }}/bin/rust-lld.exe"
      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Cache Cargo registry
        id: cargo_cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
          add-job-id-key: false
          add-rust-environment-hash-key: false
          shared-key: release-${{ matrix.target.cargo }}-rust-stable
      - name: Log cache configuration
        shell: bash
        run: |-
          echo "cargo_cache_namespace=release-${{ matrix.target.cargo }}-rust-stable"
          echo "cargo_cache_hit=${{ steps.cargo_cache.outputs.cache-hit }}"
          echo "sccache_scope=${{ github.ref }}"
          echo "sccache_namespace=${SCCACHE_GHA_VERSION}"
      - name: Install Linux native dependencies
        if: ${{ matrix.target.os == 'linux' }}
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Build Rust outputs
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ matrix.target.os == 'win32' && 'rust-lld' || '' }}
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=rust_workspace duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          cargo build --release --workspace --target "${{ matrix.target.cargo }}"
      - name: Package UniFFI outputs
        shell: bash
        env:
          VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=uniffi_packaging duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-auth" \
            --node "packages/js/node/auth" \
            --python "packages/py/auth" \
            --node-package "@dbx-tools/auth" \
            --python-package "dbx-tools-auth" \
            --cargo-target "${{ matrix.target.cargo }}" \
            --node-triple "${{ matrix.target.node }}" \
            --python-tag "${{ matrix.target.python }}" \
            --os "${{ matrix.target.os }}" \
            --cpu "${{ matrix.target.cpu }}" \
            --libc "${{ matrix.target.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-auth/${{ matrix.target.node }}" \
            --skip-build
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-databricks" \
            --node "packages/js/node/databricks" \
            --python "packages/py/databricks" \
            --node-package "@dbx-tools/databricks" \
            --python-package "dbx-tools-databricks" \
            --cargo-target "${{ matrix.target.cargo }}" \
            --node-triple "${{ matrix.target.node }}" \
            --python-tag "${{ matrix.target.python }}" \
            --os "${{ matrix.target.os }}" \
            --cpu "${{ matrix.target.cpu }}" \
            --libc "${{ matrix.target.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-databricks/${{ matrix.target.node }}" \
            --skip-build
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-databricks-auth" \
            --node "packages/js/node/databricks-auth" \
            --python "packages/py/databricks-auth" \
            --node-package "@dbx-tools/databricks-auth" \
            --python-package "dbx-tools-databricks-auth" \
            --cargo-target "${{ matrix.target.cargo }}" \
            --node-triple "${{ matrix.target.node }}" \
            --python-tag "${{ matrix.target.python }}" \
            --os "${{ matrix.target.os }}" \
            --cpu "${{ matrix.target.cpu }}" \
            --libc "${{ matrix.target.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-databricks-auth/${{ matrix.target.node }}" \
            --skip-build
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-google-auth" \
            --node "packages/js/node/google-auth" \
            --python "packages/py/google-auth" \
            --node-package "@dbx-tools/google-auth" \
            --python-package "dbx-tools-google-auth" \
            --cargo-target "${{ matrix.target.cargo }}" \
            --node-triple "${{ matrix.target.node }}" \
            --python-tag "${{ matrix.target.python }}" \
            --os "${{ matrix.target.os }}" \
            --cpu "${{ matrix.target.cpu }}" \
            --libc "${{ matrix.target.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-google-auth/${{ matrix.target.node }}" \
            --skip-build
      - name: Upload dbx-tools-auth native npm package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-auth-${{ matrix.target.node }}-npm
          path: dist/release/dbx-tools-auth/${{ matrix.target.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-auth Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-auth--${{ matrix.target.python }}--python-wheel
          path: dist/release/dbx-tools-auth/${{ matrix.target.node }}/python/*.whl
          retention-days: 7
      - name: Upload dbx-tools-databricks native npm package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-databricks-${{ matrix.target.node }}-npm
          path: dist/release/dbx-tools-databricks/${{ matrix.target.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-databricks Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-databricks--${{ matrix.target.python }}--python-wheel
          path: dist/release/dbx-tools-databricks/${{ matrix.target.node }}/python/*.whl
          retention-days: 7
      - name: Upload dbx-tools-databricks-auth native npm package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-databricks-auth-${{ matrix.target.node }}-npm
          path: dist/release/dbx-tools-databricks-auth/${{ matrix.target.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-databricks-auth Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-databricks-auth--${{ matrix.target.python }}--python-wheel
          path: dist/release/dbx-tools-databricks-auth/${{ matrix.target.node }}/python/*.whl
          retention-days: 7
      - name: Upload dbx-tools-google-auth native npm package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-google-auth-${{ matrix.target.node }}-npm
          path: dist/release/dbx-tools-google-auth/${{ matrix.target.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-google-auth Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-google-auth--${{ matrix.target.python }}--python-wheel
          path: dist/release/dbx-tools-google-auth/${{ matrix.target.node }}/python/*.whl
          retention-days: 7
      - name: Log sccache statistics
        if: ${{ always() }}
        shell: bash
        run: '"${SCCACHE_PATH}" --show-stats'
  publish-cargo:
    if: ${{ github.event_name == 'push' }}
    needs:
      - verify-context
      - rust-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish public crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |-
          cargo publish --package "dbx-tools-auth" --registry crates-io --no-verify
          cargo publish --package "dbx-tools-databricks" --registry crates-io --no-verify
          cargo publish --package "dbx-tools-databricks-auth" --registry crates-io --no-verify
          cargo publish --package "dbx-tools-google-auth" --registry crates-io --no-verify
  publish-local-cargo:
    if: ${{ github.event_name == 'push' && vars.LOCAL_REPOSITORIES == 'true' }}
    needs:
      - verify-context
      - rust-build
    runs-on:
      - self-hosted
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish Cargo crates locally
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.LOCAL_CARGO_TOKEN }}
        run: |-
          cargo publish --package "dbx-tools-auth" --registry "${{ vars.LOCAL_CARGO_REGISTRY }}" --no-verify
          cargo publish --package "dbx-tools-databricks" --registry "${{ vars.LOCAL_CARGO_REGISTRY }}" --no-verify
          cargo publish --package "dbx-tools-databricks-auth" --registry "${{ vars.LOCAL_CARGO_REGISTRY }}" --no-verify
          cargo publish --package "dbx-tools-google-auth" --registry "${{ vars.LOCAL_CARGO_REGISTRY }}" --no-verify
  publish-native-npm:
    needs:
      - rust-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Download native npm packages
        uses: actions/download-artifact@v8
        with:
          pattern: "*-npm"
          path: dist/uniffi/native
          merge-multiple: true
      - name: Publish native npm packages
        env:
          NPM_CONFIG_PROVENANCE: ${{ github.event_name == 'push' && 'true' || 'false' }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
        run: |-
          test "$(find dist/uniffi/native -name '*.tgz' | wc -l | tr -d ' ')" -gt 0
          for package in dist/uniffi/native/*.tgz; do npm publish "$package" --access public $DRY_RUN; done
  publish-node-facades:
    needs:
      - verify-context
      - publish-node
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        shell: bash
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install
        run: bun install
      - name: Save Bun cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Build and publish UniFFI npm facades
        env:
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
          NPM_CONFIG_PROVENANCE: ${{ github.event_name == 'push' && 'true' || 'false' }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
        run: |-
          node .projen/uniffi-release.mjs facade --node "packages/js/node/auth" --node-package "@dbx-tools/auth" --node-triple "linux-x64-gnu" --version "$RELEASE_VERSION" --output "dist/uniffi/facades/dbx-tools-auth"
          for package in dist/uniffi/facades/dbx-tools-auth/npm-facade/*.tgz; do npm publish "$package" --access public $DRY_RUN; done
          node .projen/uniffi-release.mjs facade --node "packages/js/node/databricks" --node-package "@dbx-tools/databricks" --node-triple "linux-x64-gnu" --version "$RELEASE_VERSION" --output "dist/uniffi/facades/dbx-tools-databricks"
          for package in dist/uniffi/facades/dbx-tools-databricks/npm-facade/*.tgz; do npm publish "$package" --access public $DRY_RUN; done
          node .projen/uniffi-release.mjs facade --node "packages/js/node/databricks-auth" --node-package "@dbx-tools/databricks-auth" --node-triple "linux-x64-gnu" --version "$RELEASE_VERSION" --output "dist/uniffi/facades/dbx-tools-databricks-auth"
          for package in dist/uniffi/facades/dbx-tools-databricks-auth/npm-facade/*.tgz; do npm publish "$package" --access public $DRY_RUN; done
          node .projen/uniffi-release.mjs facade --node "packages/js/node/google-auth" --node-package "@dbx-tools/google-auth" --node-triple "linux-x64-gnu" --version "$RELEASE_VERSION" --output "dist/uniffi/facades/dbx-tools-google-auth"
          for package in dist/uniffi/facades/dbx-tools-google-auth/npm-facade/*.tgz; do npm publish "$package" --access public $DRY_RUN; done
      - name: Smoke test published UniFFI npm facades
        if: ${{ github.event_name == 'push' && vars.UNIFFI_FACADE_SMOKE == 'true' }}
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          SMOKE_DIR="$(mktemp -d)"
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          cd "$SMOKE_DIR"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "@dbx-tools/auth@$RELEASE_VERSION"
          node -e 'import("@dbx-tools/auth")'
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "@dbx-tools/databricks@$RELEASE_VERSION"
          node -e 'import("@dbx-tools/databricks")'
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "@dbx-tools/databricks-auth@$RELEASE_VERSION"
          node -e 'import("@dbx-tools/databricks-auth")'
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "@dbx-tools/google-auth@$RELEASE_VERSION"
          node -e 'import("@dbx-tools/google-auth")'
  build-python:
    needs:
      - verify-context
      - rust-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Download dbx-tools-auth native wheels
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-auth--*--python-wheel
          path: dist/auth
          merge-multiple: true
      - name: Download dbx-tools-databricks native wheels
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-databricks--*--python-wheel
          path: dist/databricks
          merge-multiple: true
      - name: Download dbx-tools-databricks-auth native wheels
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-databricks-auth--*--python-wheel
          path: dist/databricks-auth
          merge-multiple: true
      - name: Download dbx-tools-google-auth native wheels
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-google-auth--*--python-wheel
          path: dist/google-auth
          merge-multiple: true
      - name: Stamp workspace versions
        env:
          VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          chmod -R u+w packages/py
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["VERSION"].removeprefix("v")
          package_files = sorted(Path("packages/py").glob("*/pyproject.toml"))
          packages = {}
          for path in package_files:
              source = path.read_text(encoding="utf-8")
              name = re.search(r'^name = "([^"]+)"$', source, re.MULTILINE)
              if name is None:
                  raise ValueError(f"Missing project name in {path}")
              packages[name.group(1)] = path.parent.name

          for path in package_files:
              source = path.read_text(encoding="utf-8")
              source, count = re.subn(
                  r'^version = "[^"]+"$',
                  f'version = "{version}"',
                  source,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise ValueError(f"Expected one project version in {path}")
              for name, directory in packages.items():
                  source = re.sub(
                      rf'{re.escape(name)} @ git\+[^" ]+#subdirectory=packages/py/{re.escape(directory)}',
                      f"{name}=={version}",
                      source,
                  )
              path.write_text(source, encoding="utf-8")
          PY
      - name: Build distributions
        run: |-
          uv build --package dbx-tools-core --out-dir dist/core
          uv build --package dbx-tools-postgres --out-dir dist/postgres
          uv build --package dbx-tools-model --out-dir dist/model
          uv build --package dbx-tools-litellm --out-dir dist/litellm
          uv build --package dbx-tools-graphiti --out-dir dist/graphiti
      - name: Validate distributions
        run: |-
          test "$(find dist/core -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          test "$(find dist/postgres -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          test "$(find dist/model -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          test "$(find dist/litellm -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          test "$(find dist/graphiti -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          find dist/auth -maxdepth 1 -name '*.whl' -print -quit | grep -q .
          find dist/databricks -maxdepth 1 -name '*.whl' -print -quit | grep -q .
          find dist/databricks-auth -maxdepth 1 -name '*.whl' -print -quit | grep -q .
          find dist/google-auth -maxdepth 1 -name '*.whl' -print -quit | grep -q .
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 | xargs -0 uvx twine check
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist
          retention-days: 7
  publish-pypi-core:
    if: ${{ github.event_name == 'push' }}
    needs:
      - build-python
    environment:
      name: pypi-dbx-tools-core
      url: https://pypi.org/project/dbx-tools-core/
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    timeout-minutes: 10
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist
      - name: Publish dbx-tools-core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/core
