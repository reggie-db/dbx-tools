# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: release
run-name: release ${{ github.ref_name }}
on:
  push:
    tags:
      - v*
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  verify-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      expected_sha: ${{ steps.release.outputs.expected_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
    steps:
      - name: Checkout release source
        id: checkout_release_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Install dependencies
        id: install_dependencies
        run: bun install --frozen-lockfile
      - name: Save Bun cache
        id: save_bun_cache
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository && steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Verify release context
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |-
          case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
          RELEASE_VERSION="${RELEASE_TAG#v}"
          bun node_modules/@dbx-tools/projen/tasks/release-version.ts --version "$RELEASE_VERSION"
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          RELEASE_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "origin/main")" = "$RELEASE_SHA"
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Validate docs:check-source
        id: validate_docs_check-source
        run: bun run docs:check-source
      - name: Validate docs:check-readmes
        id: validate_docs_check-readmes
        run: bun run docs:check-readmes
    timeout-minutes: 30
