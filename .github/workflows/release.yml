          merge-multiple: true
      - name: Download recovered dbx-tools-core-rs native wheels
        id: download_recovered_dbx-tools-core-rs_native_wheels
        if: ${{ needs.verify-context.outputs.build_mode == 'remote' && inputs.source_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-core-rs--*--python-wheel
          path: dist/core-rs
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download dbx-tools-google-rs native wheels
        id: download_dbx-tools-google-rs_native_wheels
        if: ${{ needs.verify-context.outputs.build_mode == 'remote' && inputs.source_run_id == '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-google-rs--*--python-wheel
          path: dist/google-rs
          merge-multiple: true
      - name: Download recovered dbx-tools-google-rs native wheels
        id: download_recovered_dbx-tools-google-rs_native_wheels
        if: ${{ needs.verify-context.outputs.build_mode == 'remote' && inputs.source_run_id != '' }}
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-google-rs--*--python-wheel
          path: dist/google-rs
          merge-multiple: true
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      - name: Download locally built native wheels
        id: download_locally_built_native_wheels
        if: ${{ needs.verify-context.outputs.build_mode == 'local' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
        run: |-
          mkdir -p dist/local-wheels
          gh release download "$RELEASE_TAG" --pattern "*.whl" --dir dist/local-wheels
          mkdir -p dist/core-rs
          cp dist/local-wheels/dbx_tools_core_rs-*.whl dist/core-rs/
          mkdir -p dist/google-rs
          cp dist/local-wheels/dbx_tools_google_rs-*.whl dist/google-rs/
        shell: bash
      - name: Stamp workspace versions
        id: stamp_workspace_versions
        env:
          VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: bun node_modules/@dbx-tools/projen/tasks/stamp-python.ts "$VERSION" --root "packages/py"
      - name: Build distributions
        id: build_distributions
        run: |-
          uv build --package dbx-tools-core --out-dir dist/core
          uv build --package dbx-tools-postgres --out-dir dist/postgres
          uv build --package dbx-tools-graphiti --out-dir dist/graphiti
      - name: Validate distributions
        id: validate_distributions
        run: |-
          test "$(find dist/core -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          test "$(find dist/postgres -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          test "$(find dist/graphiti -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')" -eq 2
          find dist/core-rs -maxdepth 1 -name '*.whl' -print -quit | grep -q .
          find dist/google-rs -maxdepth 1 -name '*.whl' -print -quit | grep -q .
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print0 | xargs -0 uvx twine check
      - name: Upload distributions
        id: upload_distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist
          retention-days: 7
    timeout-minutes: 20
  publish-pypi-core:
    needs:
      - verify-context
      - build-python
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi-dbx-tools-core
      url: https://pypi.org/project/dbx-tools-core/
    if: ${{ always() && (needs.verify-context.result == 'success') && (needs.build-python.result == 'success') && (github.event_name == 'push' || (inputs.dry_run != true && (inputs.stage == 'all' || inputs.stage == 'python'))) }}
    steps:
      - name: Download distributions
        id: download_distributions
