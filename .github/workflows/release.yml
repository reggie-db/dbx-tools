# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate but do not upload to npm
        type: boolean
        default: true
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      DRY_RUN_INPUT: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install
        id: install
        run: bun install
      - name: Set version from tag and publish
        id: set_version_from_tag_and_publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |-
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="0.0.0-dry.${GITHUB_RUN_NUMBER}"
            DRY_RUN=--dry-run
          else
            VERSION="${GITHUB_REF_NAME#v}"
            DRY_RUN="${DRY_RUN_INPUT}"
          fi
          chmod -R u+w . || true
          bun node_modules/@dbx-tools/projen/tasks/publish.ts "$VERSION" --exclude projen $DRY_RUN
    timeout-minutes: 30
permissions:
  contents: read
