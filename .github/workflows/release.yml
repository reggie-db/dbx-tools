# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: release
run-name: release ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag to validate
        type: string
        required: true
      expected_sha:
        description: Commit the release tag must reference
        type: string
        required: true
      stage:
        description: Release stage to build, validate, or recover
        type: choice
        options:
          - all
          - node
          - python
          - docs
        default: all
        required: true
      source_run_id:
        description: Earlier release workflow run containing Rust artifacts
        type: string
        default: ""
        required: false
      dry_run:
        description: Build and validate without publishing
        type: boolean
        default: true
        required: true
concurrency:
  group: release
  cancel-in-progress: true
jobs:
  verify-context:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      expected_sha: ${{ steps.release.outputs.expected_sha }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: Checkout release tag
        id: checkout_release_tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release context
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |-
          case "$RELEASE_TAG" in v*) ;; *) exit 1 ;; esac
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          RELEASE_SHA="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$GITHUB_REF_TYPE" = "tag"
            test "$GITHUB_REF_NAME" = "$RELEASE_TAG"
            test "$RELEASE_SHA" = "$EXPECTED_SHA"
            if [ -n "${{ inputs.source_run_id }}" ]; then
              case "${{ inputs.stage }}" in node|python) ;; *) exit 1 ;; esac
              case "${{ inputs.source_run_id }}" in *[!0-9]*|"") exit 1 ;; esac
            fi
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Verify source artifact run
        id: verify_source_artifact_run
        if: ${{ inputs.source_run_id != '' }}
        uses: actions/github-script@v8
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          script: |-
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.SOURCE_RUN_ID),
            });
            if (run.data.path !== ".github/workflows/release.yml") core.setFailed("Source run is not release.yml");
            if (run.data.head_sha !== process.env.EXPECTED_SHA) core.setFailed("Source run commit does not match the release tag");
  publish-node:
    needs:
      - verify-context
      - publish-native-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
    if: ${{ always() && needs.verify-context.result == 'success' && needs.publish-native-npm.result == 'success' && (github.event_name == 'push' || inputs.stage == 'all' || inputs.stage == 'node') }}
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install
        id: install
        run: bun install
      - name: Save Bun cache
        id: save_bun_cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Compile, package, and publish npm workspace
        id: compile_package_and_publish_npm_workspace
        env:
          RELEASE_VERSION: ${{ needs.verify-context.outputs.release_version }}
          NPM_CONFIG_PROVENANCE: ${{ (github.event_name == 'push' || inputs.dry_run == false) && 'true' || 'false' }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: |-
          chmod -R u+w . || true
          bun node_modules/@dbx-tools/projen/tasks/publish.ts "$RELEASE_VERSION" $DRY_RUN
    timeout-minutes: 30
  build-docs:
    needs: verify-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      BUN_VERSION: 1.3.14
      DOCS_SITE_URL: https://docs.dbx.tools
      DOCS_BASE: /
    if: ${{ github.event_name == 'push' || inputs.stage == 'all' || inputs.stage == 'docs' }}
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        id: install_dependencies
        run: bun install
      - name: Generate docs from READMEs
        id: generate_docs_from_readmes
        run: bun docs/scripts/sync-readmes.mjs
      - name: Check generated titles
        id: check_generated_titles
        run: bun docs/scripts/check-generated-titles.mjs
      - name: Install docs dependencies
        id: install_docs_dependencies
        run: bun install --cwd .docs-build/site
      - name: Save Bun cache
        id: save_bun_cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Generate TypeScript API docs
        id: generate_typescript_api_docs
        run: bun docs/scripts/generate-api-docs.mjs
      - name: Build docs
        id: build_docs
        run: bun run --cwd .docs-build/site build
      - name: Check generated links
        id: check_generated_links
        run: bun run --cwd .docs-build/site check-links
      - name: Upload Pages artifact
        id: upload_pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-build/dist
    timeout-minutes: 30
  deploy-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ github.event_name == 'push' || (inputs.dry_run == false && (inputs.stage == 'all' || inputs.stage == 'docs')) }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    timeout-minutes: 15
  rust-build:
    name: ${{ matrix.node }}
    needs: verify-context
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: release-${{ matrix.cargo }}-rust-stable
    if: ${{ github.event_name == 'push' || inputs.stage == 'all' }}
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Rust
        id: setup_rust
        if: ${{ matrix.os != 'win32' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo }}
      - name: Verify preinstalled Windows Rust
        id: verify_preinstalled_windows_rust
        if: ${{ matrix.os == 'win32' }}
        run: |-
          rustc --version --verbose
          cargo --version
          rustup target list --installed | grep -Fx "${{ matrix.cargo }}"
          test -f "$(rustc --print sysroot)/lib/rustlib/${{ matrix.cargo }}/bin/rust-lld.exe"
        shell: bash
      - name: Setup sccache
        id: sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Cache Cargo registry
        id: cargo_cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
          add-job-id-key: false
          add-rust-environment-hash-key: false
          shared-key: release-${{ matrix.cargo }}-rust-stable
      - name: Log cache configuration
        id: log_cache_configuration
        run: |-
          echo "cargo_cache_namespace=release-${{ matrix.cargo }}-rust-stable"
          echo "cargo_cache_hit=${{ steps.cargo_cache.outputs.cache-hit }}"
          echo "sccache_scope=${{ github.ref }}"
          echo "sccache_namespace=${SCCACHE_GHA_VERSION}"
        shell: bash
      - name: Install Linux native dependencies
        id: install_linux_native_dependencies
        if: ${{ matrix.os == 'linux' }}
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Build Rust outputs
        id: build_rust_outputs
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ matrix.os == 'win32' && 'rust-lld' || '' }}
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=rust_workspace duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          cargo build --release --workspace --target "${{ matrix.cargo }}"
        shell: bash
      - name: Package UniFFI outputs
        id: package_uniffi_outputs
        env:
          VERSION: ${{ needs.verify-context.outputs.release_version }}
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=uniffi_packaging duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-auth" \
            --node "packages/js/node/auth" \
            --python "packages/py/auth" \
            --node-package "@dbx-tools/auth" \
            --python-package "dbx-tools-auth" \
            --cargo-target "${{ matrix.cargo }}" \
            --node-triple "${{ matrix.node }}" \
            --python-tag "${{ matrix.python }}" \
            --os "${{ matrix.os }}" \
            --cpu "${{ matrix.cpu }}" \
            --libc "${{ matrix.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-auth/${{ matrix.node }}" \
            --skip-build
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-databricks" \
            --node "packages/js/node/databricks" \
            --python "packages/py/databricks" \
            --node-package "@dbx-tools/databricks" \
            --python-package "dbx-tools-databricks" \
            --cargo-target "${{ matrix.cargo }}" \
            --node-triple "${{ matrix.node }}" \
            --python-tag "${{ matrix.python }}" \
            --os "${{ matrix.os }}" \
            --cpu "${{ matrix.cpu }}" \
            --libc "${{ matrix.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-databricks/${{ matrix.node }}" \
            --skip-build
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-databricks-auth" \
            --node "packages/js/node/databricks-auth" \
            --python "packages/py/databricks-auth" \
            --node-package "@dbx-tools/databricks-auth" \
            --python-package "dbx-tools-databricks-auth" \
            --cargo-target "${{ matrix.cargo }}" \
            --node-triple "${{ matrix.node }}" \
            --python-tag "${{ matrix.python }}" \
            --os "${{ matrix.os }}" \
            --cpu "${{ matrix.cpu }}" \
            --libc "${{ matrix.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-databricks-auth/${{ matrix.node }}" \
            --skip-build
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-google-auth" \
            --node "packages/js/node/google-auth" \
            --python "packages/py/google-auth" \
            --node-package "@dbx-tools/google-auth" \
            --python-package "dbx-tools-google-auth" \
            --cargo-target "${{ matrix.cargo }}" \
            --node-triple "${{ matrix.node }}" \
            --python-tag "${{ matrix.python }}" \
            --os "${{ matrix.os }}" \
            --cpu "${{ matrix.cpu }}" \
            --libc "${{ matrix.libc }}" \
            --version "$VERSION" \
            --output "dist/release/dbx-tools-google-auth/${{ matrix.node }}" \
            --skip-build
        shell: bash
      - name: Upload dbx-tools-auth native npm package
        id: upload_dbx-tools-auth_native_npm_package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-auth-${{ matrix.node }}-npm
          path: dist/release/dbx-tools-auth/${{ matrix.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-auth Python wheel
        id: upload_dbx-tools-auth_python_wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-auth--${{ matrix.python }}--python-wheel
          path: dist/release/dbx-tools-auth/${{ matrix.node }}/python/*.whl
          retention-days: 7
      - name: Upload dbx-tools-databricks native npm package
        id: upload_dbx-tools-databricks_native_npm_package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-databricks-${{ matrix.node }}-npm
          path: dist/release/dbx-tools-databricks/${{ matrix.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-databricks Python wheel
        id: upload_dbx-tools-databricks_python_wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-databricks--${{ matrix.python }}--python-wheel
          path: dist/release/dbx-tools-databricks/${{ matrix.node }}/python/*.whl
          retention-days: 7
      - name: Upload dbx-tools-databricks-auth native npm package
        id: upload_dbx-tools-databricks-auth_native_npm_package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-databricks-auth-${{ matrix.node }}-npm
          path: dist/release/dbx-tools-databricks-auth/${{ matrix.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-databricks-auth Python wheel
        id: upload_dbx-tools-databricks-auth_python_wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-databricks-auth--${{ matrix.python }}--python-wheel
          path: dist/release/dbx-tools-databricks-auth/${{ matrix.node }}/python/*.whl
          retention-days: 7
      - name: Upload dbx-tools-google-auth native npm package
        id: upload_dbx-tools-google-auth_native_npm_package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-google-auth-${{ matrix.node }}-npm
          path: dist/release/dbx-tools-google-auth/${{ matrix.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-google-auth Python wheel
        id: upload_dbx-tools-google-auth_python_wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-google-auth--${{ matrix.python }}--python-wheel
          path: dist/release/dbx-tools-google-auth/${{ matrix.node }}/python/*.whl
          retention-days: 7
      - name: Log sccache statistics
        id: log_sccache_statistics
        if: ${{ always() }}
        run: '"${SCCACHE_PATH}" --show-stats'
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            cargo: x86_64-unknown-linux-gnu
            node: linux-x64-gnu
            python: manylinux_2_35_x86_64
            os: linux
            cpu: x64
            libc: glibc
          - runner: ubuntu-24.04-arm
            cargo: aarch64-unknown-linux-gnu
            node: linux-arm64-gnu
            python: manylinux_2_39_aarch64
            os: linux
            cpu: arm64
            libc: glibc
          - runner: macos-15-intel
            cargo: x86_64-apple-darwin
            node: darwin-x64
            python: macosx_13_0_x86_64
            os: darwin
            cpu: x64
          - runner: macos-14
            cargo: aarch64-apple-darwin
            node: darwin-arm64
            python: macosx_11_0_arm64
            os: darwin
            cpu: arm64
          - runner: windows-latest
            cargo: x86_64-pc-windows-msvc
            node: win32-x64-msvc
            python: win_amd64
            os: win32
            cpu: x64
  publish-cargo:
    needs:
      - verify-context
      - rust-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup Rust
        id: setup_rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish public crates
        id: publish_public_crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |-
          cargo publish --package "dbx-tools-auth" --registry crates-io --no-verify
          cargo publish --package "dbx-tools-databricks" --registry crates-io --no-verify
          cargo publish --package "dbx-tools-databricks-auth" --registry crates-io --no-verify
          cargo publish --package "dbx-tools-google-auth" --registry crates-io --no-verify
  publish-local-cargo:
    needs:
      - verify-context
      - rust-build
    runs-on: self-hosted
    permissions:
      contents: read
    if: ${{ github.event_name == 'push' && vars.LOCAL_REPOSITORIES == 'true' }}
    steps:
      - name: Checkout release commit
        id: checkout_release_commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-context.outputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ needs.verify-context.outputs.release_tag }}
          EXPECTED_SHA: ${{ needs.verify-context.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Setup Rust
        id: setup_rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish Cargo crates locally
        id: publish_cargo_crates_locally
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.LOCAL_CARGO_TOKEN }}
        run: |-
          cargo publish --package "dbx-tools-auth" --registry "${{ vars.LOCAL_CARGO_REGISTRY }}" --no-verify
          cargo publish --package "dbx-tools-databricks" --registry "${{ vars.LOCAL_CARGO_REGISTRY }}" --no-verify
          cargo publish --package "dbx-tools-databricks-auth" --registry "${{ vars.LOCAL_CARGO_REGISTRY }}" --no-verify
          cargo publish --package "dbx-tools-google-auth" --registry "${{ vars.LOCAL_CARGO_REGISTRY }}" --no-verify
  publish-native-npm:
    needs:
      - verify-context
      - rust-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
