# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: release
run-name: release units ${{ github.event_name == 'push' && github.sha || inputs.component }}
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      component:
        description: Component to recover
        type: string
        default: ""
        required: false
      version:
        description: Component version to recover
        type: string
        default: ""
        required: false
      stage:
        description: Publication target to recover
        type: choice
        options:
          - all
          - node
          - python
          - rust
          - github
          - docs
        default: all
        required: true
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      releases: ${{ steps.release.outputs.releases }}
      prs: ${{ steps.release.outputs.prs }}
      docs_changed: ${{ steps.changes.outputs.docs_changed }}
      recovery_requested: ${{ steps.recovery.outputs.requested }}
      recovery_component: ${{ steps.recovery.outputs.component }}
      recovery_version: ${{ steps.recovery.outputs.version }}
    env:
      BUN_VERSION: 1.3.14
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout source
        id: checkout_source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Install dependencies
        id: install_dependencies
        run: bun install
      - name: Refresh Release Please state
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |-
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          bun node_modules/@dbx-tools/projen/tasks/release-please.ts --owner "$OWNER" --repo "$REPO" --target-branch "main"
      - name: Detect documentation changes
        id: changes
        run: |-
          if git diff --quiet HEAD^ HEAD -- README.md AGENTS.md ':(glob)**/README.md' docs; then
            echo "docs_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_changed=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Detect committed recovery request
        id: recovery
        run: |-
          if [ -f .release-recovery.json ]; then
            echo "requested=true" >> "$GITHUB_OUTPUT"
            echo "component=$(jq -r .component .release-recovery.json)" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -r .version .release-recovery.json)" >> "$GITHUB_OUTPUT"
          else
            echo "requested=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Reconcile generated release PR files
        id: reconcile_generated_release_pr_files
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |-
          BRANCH="$(jq -r '.[0].headBranchName' <<<"$RELEASE_PRS")"
          test -n "$BRANCH" && test "$BRANCH" != "null"
          git fetch origin "$BRANCH"
          git switch --force-create "$BRANCH" "origin/$BRANCH"
          bun install
          bunx projen
          bun node_modules/@dbx-tools/projen/tasks/version-check.ts
          bun node_modules/@dbx-tools/projen/tasks/release-plan.ts --base-ref origin/main
          bun node_modules/@dbx-tools/projen/tasks/release-summary-units.ts --from-ref origin/main
          if ! git diff --quiet || test -n "$(git ls-files --others --exclude-standard)"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: reconcile release metadata"
            git push origin "HEAD:$BRANCH"
          fi
        shell: bash
    timeout-minutes: 30
  release-plan:
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.plan.outputs.release_sha }}
      rust: ${{ steps.plan.outputs.rust }}
      python: ${{ steps.plan.outputs.python }}
      node: ${{ steps.plan.outputs.node }}
      github: ${{ steps.plan.outputs.github }}
      docs: ${{ steps.plan.outputs.docs }}
      units: ${{ steps.plan.outputs.units }}
      python_packages: ${{ steps.plan.outputs.python_packages }}
      rust_packages: ${{ steps.plan.outputs.rust_packages }}
      artifacts: ${{ steps.plan.outputs.artifacts }}
      rust_targets: ${{ steps.plan.outputs.rust_targets }}
    env:
      BUN_VERSION: 1.3.14
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.releases_created == 'true' || needs.release-please.outputs.docs_changed == 'true' || needs.release-please.outputs.recovery_requested == 'true') }}
    steps:
      - name: Checkout release source
        id: checkout_release_source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Install dependencies
        id: install_dependencies
        run: bun install
      - name: Build affected release plan
        id: plan
        env:
          COMPONENT: ${{ inputs.component || needs.release-please.outputs.recovery_component || '' }}
          VERSION: ${{ inputs.version || needs.release-please.outputs.recovery_version || '' }}
          DOCS_CHANGED: ${{ needs.release-please.outputs.docs_changed || 'false' }}
        run: |-
          ARGS=()
          if [ -n "$COMPONENT" ]; then ARGS+=(--component "$COMPONENT" --version "$VERSION"); fi
          if [ "$DOCS_CHANGED" = "true" ]; then ARGS+=(--docs); fi
          bun node_modules/@dbx-tools/projen/tasks/release-plan.ts "${ARGS[@]}"
        shell: bash
      - name: Upload release plan
        id: upload_release_plan
        uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: dist/release-plan.json
          if-no-files-found: error
    timeout-minutes: 15
  publish-release-notes:
    needs: release-plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUN_VERSION: 1.3.14
    if: ${{ needs.release-plan.outputs.units != '[]' }}
    steps:
      - name: Checkout release source
        id: checkout_release_source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-plan.outputs.release_sha }}
          fetch-depth: 1
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Install dependencies
        id: install_dependencies
        run: bun install
      - name: Download release plan
        id: download_release_plan
        uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: dist
      - name: Publish component release notes
        id: publish_component_release_notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          jq -c '.units[]' dist/release-plan.json | while read -r UNIT; do
            COMPONENT="$(jq -r .component <<<"$UNIT")"
            VERSION="$(jq -r .newVersion <<<"$UNIT")"
            gh release edit "$COMPONENT-v$VERSION" --notes-file "docs/releases/$COMPONENT-v$VERSION.md"
          done
        shell: bash
  publish-node:
    needs: release-plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
    if: ${{ needs.release-plan.outputs.node == 'true' && (github.event_name == 'push' || inputs.stage == 'all' || inputs.stage == 'node') }}
    steps:
      - name: Checkout release source
        id: checkout_release_source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-plan.outputs.release_sha }}
          fetch-depth: 1
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Install dependencies
        id: install_dependencies
        run: bun install
      - name: Download release plan
        id: download_release_plan
        uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: dist
      - name: Publish affected npm packages
        id: publish_affected_npm_packages
        env:
          NPM_CONFIG_PROVENANCE: ${{ (github.event_name == 'push' || inputs.dry_run == false) && 'true' || 'false' }}
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: bun node_modules/@dbx-tools/projen/tasks/publish.ts --plan dist/release-plan.json
    timeout-minutes: 60
  rust-build:
    name: ${{ matrix.node }}
    needs: release-plan
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      BUN_VERSION: 1.3.14
    if: ${{ needs.release-plan.outputs.rust_targets != '[]' && (github.event_name == 'push' || inputs.stage != 'docs') }}
    steps:
      - name: Checkout release source
        id: checkout_release_source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-plan.outputs.release_sha }}
          fetch-depth: 1
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Install dependencies
        id: install_dependencies
        run: bun install
      - name: Download release plan
        id: download_release_plan
        uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: dist
      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Rust
        id: setup_rust
        if: ${{ matrix.os != 'win32' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo }}
      - name: Verify preinstalled Windows Rust
        id: verify_preinstalled_windows_rust
        if: ${{ matrix.os == 'win32' }}
        run: |-
          rustc --version --verbose
          cargo --version
          rustup target list --installed | grep -Fx "${{ matrix.cargo }}"
          test -f "$(rustc --print sysroot)/lib/rustlib/${{ matrix.cargo }}/bin/rust-lld.exe"
        shell: bash
      - name: Cache Cargo registry and dependencies
        id: cargo_cache
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: true
          cache-workspace-crates: false
          add-job-id-key: false
          add-rust-environment-hash-key: true
          shared-key: release-${{ matrix.cargo }}-rust-stable
          save-if: ${{ github.event_name == 'push' }}
      - name: Install Linux native dependencies
        id: install_linux_native_dependencies
        if: ${{ matrix.os == 'linux' }}
        run: |-
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Build Rust outputs
        id: build_rust_outputs
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ matrix.os == 'win32' && 'rust-lld' || '' }}
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=rust_workspace duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          mapfile -t PACKAGES < <(jq -r '.[]' <<<'${{ toJSON(matrix.packages) }}')
          PACKAGE_ARGS=()
          for PACKAGE in "${PACKAGES[@]}"; do PACKAGE_ARGS+=(--package "$PACKAGE"); done
          cargo build --release "${PACKAGE_ARGS[@]}" --locked --target "${{ matrix.cargo }}"
        shell: bash
      - name: Package UniFFI outputs
        id: package_uniffi_outputs
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=uniffi_packaging duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          if jq -e --arg unit "rs-core" '.units[] | select(.id == $unit)' dist/release-plan.json >/dev/null; then
            node .projen/uniffi-release.mjs build \
              --crate "dbx-tools-core" \
              --node "packages/js/node/core-rs" \
              --python "packages/py/core-rs" \
              --node-package "@dbx-tools/core-rs" \
              --python-package "dbx-tools-core-rs" \
              --python-module "dbx_tools.core_rs" \
              --cargo-target "${{ matrix.cargo }}" \
              --node-triple "${{ matrix.node }}" \
              --python-tag "${{ matrix.python }}" \
              --os "${{ matrix.os }}" \
              --cpu "${{ matrix.cpu }}" \
              --libc "${{ matrix.libc }}" \
              --version "$(jq -r --arg unit "rs-core" '.units[] | select(.id == $unit) | .newVersion' dist/release-plan.json)" \
              --output "dist/release/dbx-tools-core/${{ matrix.node }}" \
              --skip-build
          fi
          if jq -e --arg unit "rs-google" '.units[] | select(.id == $unit)' dist/release-plan.json >/dev/null; then
            node .projen/uniffi-release.mjs build \
              --crate "dbx-tools-google" \
              --node "packages/js/node/google-rs" \
              --python "packages/py/google-rs" \
              --node-package "@dbx-tools/google-rs" \
              --python-package "dbx-tools-google-rs" \
              --python-module "dbx_tools.google_rs" \
              --cargo-target "${{ matrix.cargo }}" \
              --node-triple "${{ matrix.node }}" \
              --python-tag "${{ matrix.python }}" \
              --os "${{ matrix.os }}" \
              --cpu "${{ matrix.cpu }}" \
              --libc "${{ matrix.libc }}" \
              --version "$(jq -r --arg unit "rs-google" '.units[] | select(.id == $unit) | .newVersion' dist/release-plan.json)" \
              --output "dist/release/dbx-tools-google/${{ matrix.node }}" \
              --skip-build
          fi
          if jq -e --arg unit "rs-model" '.units[] | select(.id == $unit)' dist/release-plan.json >/dev/null; then
            node .projen/uniffi-release.mjs build \
              --crate "dbx-tools-model" \
              --node "packages/js/node/model-rs" \
              --python "" \
              --node-package "@dbx-tools/model-rs" \
              --python-package "" \
              --python-module "undefined" \
              --cargo-target "${{ matrix.cargo }}" \
              --node-triple "${{ matrix.node }}" \
              --python-tag "${{ matrix.python }}" \
              --os "${{ matrix.os }}" \
              --cpu "${{ matrix.cpu }}" \
              --libc "${{ matrix.libc }}" \
              --version "$(jq -r --arg unit "rs-model" '.units[] | select(.id == $unit) | .newVersion' dist/release-plan.json)" \
              --output "dist/release/dbx-tools-model/${{ matrix.node }}" \
              --skip-build
          fi
        shell: bash
      - name: Package release binaries
        id: package_release_binaries
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=binary_packaging duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          if jq -e --arg unit "rs-lakebase-proxy" '.units[] | select(.id == $unit)' dist/release-plan.json >/dev/null; then
            if [ "${{ matrix.os }}" != "win32" ]; then
              mkdir -p "dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/stage"
              SOURCE="target/${{ matrix.cargo }}/release/dbx-lakebase-proxy${{ matrix.os == 'win32' && '.exe' || '' }}"
              DESTINATION="dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/stage/dbx-lakebase-proxy${{ matrix.os == 'win32' && '.exe' || '' }}"
              cp "$SOURCE" "$DESTINATION"
              if [ "${{ matrix.os }}" = "win32" ]; then
                7z a "dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/dbx-lakebase-proxy-${{ matrix.node }}.zip" "$DESTINATION"
              else
                tar -C "dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/stage" -czf "dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/dbx-lakebase-proxy-${{ matrix.node }}.tar.gz" "dbx-lakebase-proxy"
              fi
              rm -rf "dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/stage"
            fi
          fi
          if jq -e --arg unit "rs-model-proxy" '.units[] | select(.id == $unit)' dist/release-plan.json >/dev/null; then
            mkdir -p "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage"
            SOURCE="target/${{ matrix.cargo }}/release/dbx-model-proxy${{ matrix.os == 'win32' && '.exe' || '' }}"
            DESTINATION="dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage/dbx-model-proxy${{ matrix.os == 'win32' && '.exe' || '' }}"
            cp "$SOURCE" "$DESTINATION"
            if [ "${{ matrix.os }}" = "win32" ]; then
              7z a "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/dbx-model-proxy-${{ matrix.node }}.zip" "$DESTINATION"
            else
              tar -C "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage" -czf "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/dbx-model-proxy-${{ matrix.node }}.tar.gz" "dbx-model-proxy"
            fi
            rm -rf "dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/stage"
          fi
        shell: bash
      - name: Upload dbx-tools-core native npm package
        id: upload_dbx-tools-core_native_npm_package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-core-${{ matrix.node }}-npm
          path: dist/release/dbx-tools-core/${{ matrix.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-core Python wheel
        id: upload_dbx-tools-core_python_wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-core-rs--${{ matrix.python }}--python-wheel
          path: dist/release/dbx-tools-core/${{ matrix.node }}/python/*.whl
          retention-days: 7
      - name: Upload dbx-tools-google native npm package
        id: upload_dbx-tools-google_native_npm_package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-google-${{ matrix.node }}-npm
          path: dist/release/dbx-tools-google/${{ matrix.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-google Python wheel
        id: upload_dbx-tools-google_python_wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-google-rs--${{ matrix.python }}--python-wheel
          path: dist/release/dbx-tools-google/${{ matrix.node }}/python/*.whl
          retention-days: 7
      - name: Upload dbx-tools-model native npm package
        id: upload_dbx-tools-model_native_npm_package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-model-${{ matrix.node }}-npm
          path: dist/release/dbx-tools-model/${{ matrix.node }}/npm/*.tgz
          retention-days: 7
      - name: Upload dbx-tools-lakebase-proxy release binary
        id: upload_dbx-tools-lakebase-proxy_release_binary
        if: ${{ matrix.os != 'win32' }}
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-lakebase-proxy-${{ matrix.node }}-binary
          path: dist/release/dbx-tools-lakebase-proxy/${{ matrix.node }}/binary/*
          retention-days: 7
      - name: Upload dbx-tools-model-proxy release binary
        id: upload_dbx-tools-model-proxy_release_binary
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-model-proxy-${{ matrix.node }}-binary
          path: dist/release/dbx-tools-model-proxy/${{ matrix.node }}/binary/*
          retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-plan.outputs.rust_targets) }}
  publish-cargo:
    needs:
      - release-plan
      - rust-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUN_VERSION: 1.3.14
    if: ${{ always() && needs.release-plan.outputs.rust == 'true' && needs.rust-build.result != 'failure' && needs.rust-build.result != 'cancelled' && (github.event_name == 'push' || inputs.stage == 'all' || inputs.stage == 'rust') }}
    steps:
      - name: Checkout release source
        id: checkout_release_source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-plan.outputs.release_sha }}
          fetch-depth: 1
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
