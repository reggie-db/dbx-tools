name: docs

on:
  workflow_run:
    workflows:
      - node-release
    types:
      - completed
  workflow_dispatch:

env:
  DOCS_SITE_URL: https://docs.dbx.tools
  DOCS_BASE: /

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install
      - name: Generate docs from READMEs
        run: bun docs/scripts/sync-readmes.mjs
      - name: Check generated titles
        run: bun docs/scripts/check-generated-titles.mjs
      - name: Install docs dependencies
        run: bun install --cwd .docs-build/site
      - name: Generate TypeScript API docs
        run: bun docs/scripts/generate-api-docs.mjs
      - name: Build docs
        run: bun run --cwd .docs-build/site build
      - name: Check generated links
        run: bun run --cwd .docs-build/site check-links
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-build/dist

  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_run') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
