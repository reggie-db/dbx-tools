name: docs

on:
  workflow_run:
    workflows:
      - node-release
    types:
      - completed
  workflow_dispatch:

env:
  DOCS_SITE_URL: https://docs.dbx.tools
  DOCS_BASE: /

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'push')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download release metadata
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: .release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read release metadata
        id: release_metadata
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          RELEASE_TAG="$(cat .release/tag)"
          EXPECTED_SHA="$(cat .release/sha)"
          test -n "$RELEASE_TAG"
          test -n "$EXPECTED_SHA"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && steps.release_metadata.outputs.expected_sha || github.sha }}
          fetch-depth: 0
      - name: Verify release source
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          RELEASE_TAG: ${{ steps.release_metadata.outputs.release_tag }}
          EXPECTED_SHA: ${{ steps.release_metadata.outputs.expected_sha }}
        run: |
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install
      - name: Generate docs from READMEs
        run: bun docs/scripts/sync-readmes.mjs
      - name: Check generated titles
        run: bun docs/scripts/check-generated-titles.mjs
      - name: Install docs dependencies
        run: bun install --cwd .docs-build/site
      - name: Generate TypeScript API docs
        run: bun docs/scripts/generate-api-docs.mjs
      - name: Build docs
        run: bun run --cwd .docs-build/site build
      - name: Check generated links
        run: bun run --cwd .docs-build/site check-links
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .docs-build/dist

  deploy:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'push')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
