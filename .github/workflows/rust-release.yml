            target:
              runner: macos-15-intel
              cargo: x86_64-apple-darwin
              node: darwin-x64
              python: macosx_13_0_x86_64
              os: darwin
              cpu: x64
              facade: false
          - binding:
              crate: dbx-tools-auth-u2m
              rust: packages/rs/auth-u2m
              node: packages/js/node/auth-u2m
              nodePackage: "@dbx-tools/auth-u2m"
              python: packages/py/auth-u2m
              pythonPackage: dbx-tools-auth-u2m
            target:
              runner: macos-14
              cargo: aarch64-apple-darwin
