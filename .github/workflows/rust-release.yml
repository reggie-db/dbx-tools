name: rust-release
run-name: rust-release ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
on:
  repository_dispatch:
    types:
      - rust-release
  workflow_dispatch:
    inputs:
      release_tag:
        description: Annotated release tag to build
        type: string
        required: true
      expected_sha:
        description: Commit the release tag must reference
        type: string
        required: true
concurrency:
  group: rust-release
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-context:
    runs-on: ubuntu-latest
    steps:
      - name: Require the default branch cache scope
        shell: bash
        env:
          RELEASE_BRANCH: main
        run: test "$GITHUB_REF_NAME" = "$RELEASE_BRANCH"
      - name: Write release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
          EXPECTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
        run: |-
          mkdir -p .release
          printf "%s\n" "$RELEASE_TAG" > .release/tag
          printf "%s\n" "$EXPECTED_SHA" > .release/sha
      - name: Upload release metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: .release
  build:
    name: ${{ matrix.target.node }}
    needs:
      - verify-context
    runs-on: ${{ matrix.target.runner }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      BUN_VERSION: 1.3.14
      SCCACHE_GHA_VERSION: release-${{ matrix.target.cargo }}-rust-stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - target:
              runner: ubuntu-22.04
              cargo: x86_64-unknown-linux-gnu
              node: linux-x64-gnu
              python: manylinux_2_35_x86_64
              os: linux
              cpu: x64
              libc: glibc
              facade: true
          - target:
              runner: ubuntu-24.04-arm
              cargo: aarch64-unknown-linux-gnu
              node: linux-arm64-gnu
              python: manylinux_2_39_aarch64
              os: linux
              cpu: arm64
              libc: glibc
              facade: false
          - target:
              runner: macos-15-intel
              cargo: x86_64-apple-darwin
              node: darwin-x64
              python: macosx_13_0_x86_64
              os: darwin
              cpu: x64
              facade: false
          - target:
              runner: macos-14
              cargo: aarch64-apple-darwin
              node: darwin-arm64
              python: macosx_11_0_arm64
              os: darwin
              cpu: arm64
              facade: false
          - target:
              runner: windows-latest
              cargo: x86_64-pc-windows-msvc
              node: win32-x64-msvc
              python: win_amd64
              os: win32
              cpu: x64
              facade: false
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
          fetch-depth: 1
      - name: Verify release source
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
          EXPECTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
        run: |-
          test -n "$RELEASE_TAG"
          test -n "$EXPECTED_SHA"
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Rust
        if: ${{ matrix.target.os != 'win32' }}
