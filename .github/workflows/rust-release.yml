# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: rust-release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to package during a dry run
        type: string
        default: 0.0.0.dev0
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.target.node }}
    runs-on: ${{ matrix.target.runner }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target:
              runner: ubuntu-22.04
              cargo: x86_64-unknown-linux-gnu
              node: linux-x64-gnu
              python: manylinux_2_35_x86_64
              os: linux
              cpu: x64
              libc: glibc
              facade: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.cargo }}
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
          add-job-id-key: false
          add-rust-environment-hash-key: false
          shared-key: release-${{ matrix.target.cargo }}
      - name: Install Linux native dependencies
        if: ${{ matrix.target.os == 'linux' }}
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Install Node tooling
        run: bun install
      - name: Build Rust outputs
        run: cargo build --release --workspace --target "${{ matrix.target.cargo }}"
      - name: Package UniFFI outputs
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |-
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-auth-u2m" \
            --node "packages/js/node/auth-u2m" \
            --python "packages/py/auth-u2m" \
            --node-package "@dbx-tools/auth-u2m" \
            --python-package "dbx-tools-auth-u2m" \
            --node-generator "node_modules/@dbx-tools/projen/tasks/uniffi.ts" \
            --cargo-target "${{ matrix.target.cargo }}" \
            --node-triple "${{ matrix.target.node }}" \
            --python-tag "${{ matrix.target.python }}" \
            --os "${{ matrix.target.os }}" \
            --cpu "${{ matrix.target.cpu }}" \
            --libc "${{ matrix.target.libc }}" \
            --facade "${{ matrix.target.facade }}" \
            --version "${VERSION#v}" \
            --output "dist/release/dbx-tools-auth-u2m/${{ matrix.target.node }}" \
            --skip-build
      - name: Package release binaries
        shell: bash
        run: |-
          mkdir -p "dist/release/dbx-tools-auth-u2m-cli/${{ matrix.target.node }}/binary/stage"
          SOURCE="target/${{ matrix.target.cargo }}/release/dbx-tools-auth${{ matrix.target.os == 'win32' && '.exe' || '' }}"
          DESTINATION="dist/release/dbx-tools-auth-u2m-cli/${{ matrix.target.node }}/binary/stage/dbx-tools-auth${{ matrix.target.os == 'win32' && '.exe' || '' }}"
          cp "$SOURCE" "$DESTINATION"
          if [ "${{ matrix.target.os }}" = "win32" ]; then
            7z a "dist/release/dbx-tools-auth-u2m-cli/${{ matrix.target.node }}/binary/dbx-tools-auth-${{ matrix.target.node }}.zip" "$DESTINATION"
          else
            tar -C "dist/release/dbx-tools-auth-u2m-cli/${{ matrix.target.node }}/binary/stage" -czf "dist/release/dbx-tools-auth-u2m-cli/${{ matrix.target.node }}/binary/dbx-tools-auth-${{ matrix.target.node }}.tar.gz" "dbx-tools-auth"
          fi
          rm -rf "dist/release/dbx-tools-auth-u2m-cli/${{ matrix.target.node }}/binary/stage"
      - name: Upload dbx-tools-auth-u2m native npm package
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-auth-u2m-${{ matrix.target.node }}-npm
          path: dist/release/dbx-tools-auth-u2m/${{ matrix.target.node }}/npm/*.tgz
      - name: Upload dbx-tools-auth-u2m npm facade
        if: ${{ matrix.target.facade }}
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-auth-u2m-npm-facade
          path: dist/release/dbx-tools-auth-u2m/${{ matrix.target.node }}/npm-facade/*.tgz
      - name: Upload dbx-tools-auth-u2m Python wheel
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-auth-u2m-${{ matrix.target.python }}-python-wheel
          path: dist/release/dbx-tools-auth-u2m/${{ matrix.target.node }}/python/*.whl
      - name: Upload dbx-tools-auth-u2m-cli release binary
        uses: actions/upload-artifact@v7
        with:
          name: dbx-tools-auth-u2m-cli-${{ matrix.target.node }}-binary
          path: dist/release/dbx-tools-auth-u2m-cli/${{ matrix.target.node }}/binary/*
  publish-dbx-tools-auth-u2m:
    if: ${{ github.event_name == 'push' }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi-dbx-tools-auth-u2m
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org
      - name: Download native npm packages
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-auth-u2m-*-npm
          path: dist/npm
          merge-multiple: true
      - name: Download npm facade
        uses: actions/download-artifact@v8
        with:
          name: dbx-tools-auth-u2m-npm-facade
          path: dist/npm-facade
      - name: Publish native npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: for package in dist/npm/*.tgz; do npm publish "$package" --access public; done
      - name: Publish npm facade
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: for package in dist/npm-facade/*.tgz; do npm publish "$package" --access public; done
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Download Python wheels
        uses: actions/download-artifact@v8
        with:
          pattern: dbx-tools-auth-u2m-*-python-wheel
          path: dist/python
          merge-multiple: true
      - name: Publish Python wheels
        run: uv publish --trusted-publishing always dist/python/*.whl
  publish-cargo:
    if: ${{ github.event_name == 'push' }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish public crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |-
          cargo publish --package "dbx-tools-auth-u2m" --registry crates-io --no-verify
          cargo publish --package "dbx-tools-auth-u2m-cli" --registry crates-io --no-verify
  publish-local:
    if: ${{ github.event_name == 'push' && vars.LOCAL_REPOSITORIES == 'true' }}
    runs-on:
      - self-hosted
    permissions:
      contents: read
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-targets: false
          add-job-id-key: false
          add-rust-environment-hash-key: false
          shared-key: local-${{ runner.os }}-${{ runner.arch }}
      - name: Install
        run: bun install
      - name: Build and publish host-native packages
        run: |-
          VERSION="${GITHUB_REF_NAME#v}"
          bun node_modules/@dbx-tools/projen/tasks/publish-uniffi-local.ts --version "$VERSION" --registry "${{ vars.LOCAL_NPM_REGISTRY }}" --pypi-publish-url "${{ vars.LOCAL_PYPI_PUBLISH_URL }}" --cargo-registry "${{ vars.LOCAL_CARGO_REGISTRY }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LOCAL_NPM_TOKEN }}
          UV_PUBLISH_USERNAME: ${{ secrets.LOCAL_PYPI_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.LOCAL_PYPI_PASSWORD }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.LOCAL_CARGO_TOKEN }}
  publish-github-release:
    if: ${{ github.event_name == 'push' }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "*-binary"
          path: dist/rust-release
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rust-release/*
          generate-release-notes: true
