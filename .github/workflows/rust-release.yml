        if: ${{ matrix.target.facade && steps.ubrn_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
      - name: Restore Bun cache
        id: bun_cache
        if: ${{ matrix.target.facade && steps.ubrn_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Log cache configuration
        shell: bash
        run: |-
          echo "cargo_cache_namespace=release-${{ matrix.target.cargo }}-rust-stable"
          echo "cargo_cache_hit=${{ steps.cargo_cache.outputs.cache-hit }}"
          echo "sccache_scope=${{ github.ref }}"
          echo "sccache_namespace=${SCCACHE_GHA_VERSION}"
          echo "ubrn_rust_toolchain=stable"
          echo "ubrn_executable_cache_key=ubrn-executable-${{ runner.os }}-${{ runner.arch }}-rust-stable-0.31.0-5"
          echo "ubrn_executable_cache_hit=${{ steps.ubrn_cache.outputs.cache-hit }}"
      - name: Install Linux native dependencies
        if: ${{ matrix.target.os == 'linux' }}
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - name: Install Node tooling
        if: ${{ matrix.target.facade && steps.ubrn_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=node_tooling duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          bun install
      - name: Save Bun cache
        if: ${{ matrix.target.facade && steps.ubrn_cache.outputs.cache-hit != 'true' && steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Prepare UBRN generator
        if: ${{ matrix.target.facade && steps.ubrn_cache.outputs.cache-hit != 'true' }}
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/ubrn
          UBRN_EXECUTABLE: ${{ github.workspace }}/.cache/ubrn/uniffi-bindgen-react-native${{ matrix.target.os == 'win32' && '.exe' || '' }}
        shell: bash
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=ubrn_generator duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          cargo +stable build --manifest-path node_modules/uniffi-bindgen-react-native/crates/ubrn_cli/Cargo.toml
          mkdir -p "$(dirname "$UBRN_EXECUTABLE")"
          cp "target/ubrn/debug/uniffi-bindgen-react-native${{ matrix.target.os == 'win32' && '.exe' || '' }}" "$UBRN_EXECUTABLE"
          chmod +x "$UBRN_EXECUTABLE"
      - name: Verify UBRN executable
        if: ${{ matrix.target.facade }}
        env:
          UBRN_EXECUTABLE: ${{ github.workspace }}/.cache/ubrn/uniffi-bindgen-react-native${{ matrix.target.os == 'win32' && '.exe' || '' }}
        shell: bash
        run: test -f "$UBRN_EXECUTABLE"
      - name: Save UBRN executable
        if: ${{ matrix.target.facade && steps.ubrn_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .cache/ubrn
          key: ${{ steps.ubrn_cache.outputs.cache-primary-key }}
      - name: Build Rust outputs
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ${{ matrix.target.os == 'win32' && 'rust-lld' || '' }}
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=rust_workspace duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          cargo build --release --workspace --target "${{ matrix.target.cargo }}"
      - name: Package UniFFI outputs
        shell: bash
        env:
          VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
          UBRN_EXECUTABLE: ${{ github.workspace }}/.cache/ubrn/uniffi-bindgen-react-native${{ matrix.target.os == 'win32' && '.exe' || '' }}
        run: |-
          SECONDS=0
          trap 'status=$?; echo "phase=uniffi_packaging duration_seconds=$SECONDS status=$status"; exit "$status"' EXIT
          node .projen/uniffi-release.mjs build \
            --crate "dbx-tools-auth" \
