              python: packages/py/auth-u2m
              pythonPackage: dbx-tools-auth-u2m
            target:
              runner: ubuntu-24.04-arm
              cargo: aarch64-unknown-linux-gnu
              node: linux-arm64-gnu
              python: manylinux_2_39_aarch64
              os: linux
              cpu: arm64
              libc: glibc
              facade: false
          - binding:
