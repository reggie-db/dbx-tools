  publish:
    if: ${{ github.event_name == 'push' }}
    needs:
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        binding:
          - crate: dbx-tools-auth-u2m
            rust: packages/rs/auth-u2m
            publishCargo: true
            node: packages/js/node/auth-u2m
            nodePackage: "@dbx-tools/auth-u2m"
            python: packages/py/auth-u2m
            pythonPackage: dbx-tools-auth-u2m
    permissions:
      contents: read
      id-token: write
    environment:
      name: native-${{ matrix.binding.crate }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          registry-url: https://registry.npmjs.org
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Install
        run: bun install
      - name: Publish workspace npm dependencies
        if: ${{ matrix.binding.node != '' }}
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |-
          VERSION="${GITHUB_REF_NAME#v}"
          bun node_modules/@dbx-tools/projen/tasks/publish.ts "$VERSION" --exclude projen --exclude "${{ matrix.binding.node }}"
