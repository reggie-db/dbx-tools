name: npm token probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm administration CLI
        run: npm install --global npm@11.19.0

      - name: Probe npm token access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            @dbx-tools/appkit-mastra
            @dbx-tools/appkit-web-search
            @dbx-tools/cli-tunnel
            @dbx-tools/cli
            @dbx-tools/databricks-zerobus
            @dbx-tools/projen
            @dbx-tools/search
            @dbx-tools/teams
            @dbx-tools/tunnel
          )

          actor="$(npm whoami --registry=https://registry.npmjs.org)"
          printf 'Authenticated npm actor: %s\n' "$actor"

          stages="$(mktemp)"
          npm stage list --json --registry=https://registry.npmjs.org >"$stages"
          jq -r '
            [
              .[]
              | select(.packageName | startswith("@dbx-tools/"))
              | {package: .packageName, version, id}
            ]
            | "Visible @dbx-tools stages: \(length)",
              (.[] | "- \(.package)@\(.version) stage=\(.id)")
          ' "$stages"

          for package in "${packages[@]}"; do
            printf '\nPackage: %s\n' "$package"
            if published_version="$(npm view "$package@0.9.19" version --json --registry=https://registry.npmjs.org 2>/dev/null)"; then
              printf 'Published version: %s\n' "$published_version"
            else
              printf 'Published version: unavailable\n'
            fi

            npm access get status "$package" --json --registry=https://registry.npmjs.org \
              | jq -c '{access: .}'

            collaborators="$(mktemp)"
            if npm access list collaborators "$package" --json --registry=https://registry.npmjs.org >"$collaborators" 2>/dev/null; then
              jq -c --arg actor "$actor" '{actorAccess: .[$actor] // "none"}' "$collaborators"
            else
              printf '%s\n' '{"actorAccess":"unavailable"}'
            fi
            rm -f "$collaborators"

            trust="$(mktemp)"
            trust_error="$(mktemp)"
            if npm trust list "$package" --json --registry=https://registry.npmjs.org >"$trust" 2>"$trust_error"; then
              jq -c '{trustedPublishers: .}' "$trust"
            else
              printf '{"trustedPublishers":"unavailable","reason":'
              tail -n 1 "$trust_error" | jq -Rs 'rtrimstr("\n")'
              printf '}\n'
            fi
            rm -f "$trust" "$trust_error"
          done

          rm -f "$stages"
