# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: node-release
on:
  workflow_run:
    workflows:
      - python-release
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and validate but do not upload to npm
        type: boolean
        default: true
concurrency:
  group: node-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CI: "true"
      DRY_RUN_INPUT: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'workflow_run' || github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'repository_dispatch')) }}
    steps:
      - name: Download release metadata
        id: download_release_metadata
        uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: .release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read release metadata
        id: release_metadata
        run: |-
          RELEASE_TAG="$(cat .release/tag)"
          EXPECTED_SHA="$(cat .release/sha)"
          test -n "$RELEASE_TAG"
          test -n "$EXPECTED_SHA"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.release_metadata.outputs.expected_sha }}
      - name: Verify release source
        id: verify_release_source
        env:
          SOURCE_RELEASE_TAG: ${{ steps.release_metadata.outputs.release_tag }}
          EXPECTED_SHA: ${{ steps.release_metadata.outputs.expected_sha }}
        run: |-
          git fetch --force origin "+refs/tags/$SOURCE_RELEASE_TAG:refs/tags/$SOURCE_RELEASE_TAG"
          test "$(git rev-parse "$SOURCE_RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          RELEASE_TAG="$(git tag --points-at HEAD --list "v*" | sort -V | tail -1)"
          test -n "$RELEASE_TAG"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
        shell: bash
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install
        id: install
        run: bun install
      - name: Upload release metadata
        id: upload_release_metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: .release
      - name: Set version from tag and publish
        id: set_version_from_tag_and_publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |-
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="0.0.0-dry.${GITHUB_RUN_NUMBER}"
            DRY_RUN=--dry-run
          elif [ -n "${RELEASE_VERSION:-}" ]; then
            VERSION="$RELEASE_VERSION"
            DRY_RUN=
          else
            VERSION="${GITHUB_REF_NAME#v}"
            DRY_RUN="${DRY_RUN_INPUT}"
          fi
          chmod -R u+w . || true
          bun node_modules/@dbx-tools/projen/tasks/publish.ts "$VERSION" --exclude projen $DRY_RUN
    timeout-minutes: 30
permissions:
  contents: read
  actions: read
