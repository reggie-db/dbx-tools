# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: node-release
on:
  repository_dispatch:
    types:
      - release
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package during a dry run
        type: string
        required: true
      expected_sha:
        description: Commit the release tag must reference
        type: string
        required: true
      dry_run:
        description: Pack and validate but do not upload to npm
        type: boolean
        default: true
concurrency:
  group: node-release
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      CI: "true"
      DRY_RUN_INPUT: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
          EXPECTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
        run: |-
          test -n "$RELEASE_TAG"
          test -n "$EXPECTED_SHA"
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Resolve package release tag
        id: resolve_package_release_tag
        env:
          SOURCE_RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
          EXPECTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
        run: |-
          SOURCE_VERSION="${SOURCE_RELEASE_TAG#v}"
          RELEASE_TAG="v${SOURCE_VERSION}"
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          mkdir -p .release
          printf "%s\n" "$SOURCE_RELEASE_TAG" > .release/tag
          printf "%s\n" "$EXPECTED_SHA" > .release/sha
        shell: bash
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install
        id: install
        run: bun install
      - name: Upload release metadata
        id: upload_release_metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: .release
      - name: Set version from tag and publish
        id: set_version_from_tag_and_publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |-
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="0.0.0-dry.${GITHUB_RUN_NUMBER}"
            DRY_RUN=--dry-run
          elif [ -n "${RELEASE_VERSION:-}" ]; then
            VERSION="$RELEASE_VERSION"
            DRY_RUN=
          else
            VERSION="${GITHUB_REF_NAME#v}"
            DRY_RUN="${DRY_RUN_INPUT}"
          fi
          chmod -R u+w . || true
          bun node_modules/@dbx-tools/projen/tasks/publish.ts "$VERSION" --exclude projen $DRY_RUN
    timeout-minutes: 30
permissions:
  contents: read
