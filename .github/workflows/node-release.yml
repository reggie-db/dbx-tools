# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

name: node-release
on:
  repository_dispatch:
    types:
      - release
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to package during a dry run
        type: string
        required: true
      expected_sha:
        description: Commit the release tag must reference
        type: string
        required: true
      dry_run:
        description: Pack and validate but do not upload to npm
        type: boolean
        default: true
concurrency:
  group: node-release
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      BUN_VERSION: 1.3.14
      CI: "true"
      DRY_RUN_INPUT: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
      - name: Verify release source
        id: verify_release_source
        env:
          RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
          EXPECTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
        run: |-
          test -n "$RELEASE_TAG"
          test -n "$EXPECTED_SHA"
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
        shell: bash
      - name: Resolve package release tag
        id: resolve_package_release_tag
        env:
          SOURCE_RELEASE_TAG: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_tag || inputs.release_tag }}
          EXPECTED_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.expected_sha || inputs.expected_sha }}
        run: |-
          SOURCE_VERSION="${SOURCE_RELEASE_TAG#v}"
          RELEASE_TAG="v${SOURCE_VERSION}"
          git fetch --force origin "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$EXPECTED_SHA"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          mkdir -p .release
          printf "%s\n" "$SOURCE_RELEASE_TAG" > .release/tag
          printf "%s\n" "$EXPECTED_SHA" > .release/sha
        shell: bash
      - name: Setup Bun
        id: setup_bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Resolve Bun cache
        id: bun_cache_metadata
        run: |-
          echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
          echo "dependency_hash=$(node .projen/bun-cache-key.mjs)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore Bun cache
        id: bun_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ steps.bun_cache_metadata.outputs.dependency_hash }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Setup Node.js
        id: setup_node_js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - name: Install
        id: install
        run: bun install
      - name: Save Bun cache
        id: save_bun_cache
        if: ${{ steps.bun_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.bun_cache_metadata.outputs.path }}
          key: ${{ steps.bun_cache.outputs.cache-primary-key }}
      - name: Upload release metadata
        id: upload_release_metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: .release
      - name: Require Rust artifact handoff
        id: require_rust_artifact_handoff
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          RUST_RUN_ID: ${{ github.event.client_payload.rust_run_id }}
          RUST_RUN_ATTEMPT: ${{ github.event.client_payload.rust_run_attempt }}
        run: |-
          test -n "$RUST_RUN_ID"
          test -n "$RUST_RUN_ATTEMPT"
        shell: bash
      - name: Download native npm packages
        id: download_native_npm_packages
        if: ${{ github.event_name == 'repository_dispatch' }}
        uses: actions/download-artifact@v8
        with:
          pattern: "*-npm"
          path: dist/uniffi/native
          merge-multiple: true
          run-id: ${{ github.event.client_payload.rust_run_id }}
          github-token: ${{ github.token }}
      - name: Publish native npm packages
        id: publish_native_npm_packages
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |-
          test "$(find dist/uniffi/native -name '*.tgz' | wc -l | tr -d ' ')" -gt 0
          for package in dist/uniffi/native/*.tgz; do npm publish "$package" --access public; done
      - name: Set version from tag and publish
        id: set_version_from_tag_and_publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |-
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="0.0.0-dry.${GITHUB_RUN_NUMBER}"
            DRY_RUN=--dry-run
          elif [ -n "${RELEASE_VERSION:-}" ]; then
            VERSION="$RELEASE_VERSION"
            DRY_RUN=
          else
            VERSION="${GITHUB_REF_NAME#v}"
            DRY_RUN="${DRY_RUN_INPUT}"
          fi
          chmod -R u+w . || true
          bun node_modules/@dbx-tools/projen/tasks/publish.ts "$VERSION" $DRY_RUN
      - name: Build and publish UniFFI npm facades
        id: build_and_publish_uniffi_npm_facades
        env:
          NPM_CONFIG_PROVENANCE: "true"
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |-
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="0.0.0-dry.${GITHUB_RUN_NUMBER}"
            DRY_RUN=--dry-run
          else
            VERSION="$RELEASE_VERSION"
            DRY_RUN=
          fi
          NATIVE_ARG=""
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            NATIVE_PACKAGE="$(find dist/uniffi/native -name 'dbx-tools-auth-linux-x64-gnu-*.tgz' -print -quit)"
            test -n "$NATIVE_PACKAGE"
            NATIVE_ARG="--native-package $NATIVE_PACKAGE"
          fi
          node .projen/uniffi-release.mjs facade --node "packages/js/node/auth" --node-package "@dbx-tools/auth" --node-triple "linux-x64-gnu" --version "$VERSION" --output "dist/uniffi/facades/dbx-tools-auth" $NATIVE_ARG
          for package in dist/uniffi/facades/dbx-tools-auth/npm-facade/*.tgz; do npm publish "$package" --access public $DRY_RUN; done
          NATIVE_ARG=""
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            NATIVE_PACKAGE="$(find dist/uniffi/native -name 'dbx-tools-databricks-linux-x64-gnu-*.tgz' -print -quit)"
            test -n "$NATIVE_PACKAGE"
            NATIVE_ARG="--native-package $NATIVE_PACKAGE"
          fi
          node .projen/uniffi-release.mjs facade --node "packages/js/node/databricks" --node-package "@dbx-tools/databricks" --node-triple "linux-x64-gnu" --version "$VERSION" --output "dist/uniffi/facades/dbx-tools-databricks" $NATIVE_ARG
          for package in dist/uniffi/facades/dbx-tools-databricks/npm-facade/*.tgz; do npm publish "$package" --access public $DRY_RUN; done
          NATIVE_ARG=""
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            NATIVE_PACKAGE="$(find dist/uniffi/native -name 'dbx-tools-databricks-auth-linux-x64-gnu-*.tgz' -print -quit)"
            test -n "$NATIVE_PACKAGE"
            NATIVE_ARG="--native-package $NATIVE_PACKAGE"
          fi
          node .projen/uniffi-release.mjs facade --node "packages/js/node/databricks-auth" --node-package "@dbx-tools/databricks-auth" --node-triple "linux-x64-gnu" --version "$VERSION" --output "dist/uniffi/facades/dbx-tools-databricks-auth" $NATIVE_ARG
          for package in dist/uniffi/facades/dbx-tools-databricks-auth/npm-facade/*.tgz; do npm publish "$package" --access public $DRY_RUN; done
          NATIVE_ARG=""
          if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
            NATIVE_PACKAGE="$(find dist/uniffi/native -name 'dbx-tools-google-auth-linux-x64-gnu-*.tgz' -print -quit)"
            test -n "$NATIVE_PACKAGE"
            NATIVE_ARG="--native-package $NATIVE_PACKAGE"
          fi
          node .projen/uniffi-release.mjs facade --node "packages/js/node/google-auth" --node-package "@dbx-tools/google-auth" --node-triple "linux-x64-gnu" --version "$VERSION" --output "dist/uniffi/facades/dbx-tools-google-auth" $NATIVE_ARG
          for package in dist/uniffi/facades/dbx-tools-google-auth/npm-facade/*.tgz; do npm publish "$package" --access public $DRY_RUN; done
    timeout-minutes: 30
permissions:
  contents: read
  actions: read
