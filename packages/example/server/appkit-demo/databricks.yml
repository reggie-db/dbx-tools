bundle:
  name: dbx-tools-demo
  engine: direct

variables:
  app_name:
    default: dbx-tools-demo
  lakebase_project_id:
    default: dbx-tools-demo-v2
  genie_space_id:
    default: 01f1890bd0cd1a7d93cb3c6dba8ab1e5
  warehouse_id:
    default: a2171589c3905bc7
  experiment_id:
    default: "798709075143130"
  secret_scope:
    default: dbx-tools-demo
  tunnel_auth_allow:
    default: databricks.com
  lakebase_endpoint:
    default: projects/${var.lakebase_project_id}/branches/production/endpoints/primary
  genie_identity:
    default: auto
  mlflow_tracking_uri:
    default: databricks
  otel_propagators:
    default: none
  client_dist:
    default: ./client-dist
  tunnel_public_domain:
    default: demo.apps.dbx.tools

workspace:
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

# The demo is deployed to the AWS FEVM workspace. Pinning `host` here (rather
# than relying on whichever profile happens to be active) is what keeps
# `bundle deploy` from landing in another workspace: the CLI matches the host
# against `~/.databrickscfg` and errors if the active profile points elsewhere.
targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fevm-reggie-pierce-aws.cloud.databricks.com
      # Named explicitly because more than one profile in `~/.databrickscfg`
      # points at this host, and the CLI refuses to guess between them.
      profile: FEVM-REGGIE-PIERCE-AWS

resources:
  # Lakebase Autoscaling project backing the demo's memory tools. Lakebase
  # automatically provisions the `production` branch and its `primary`
  # read-write endpoint. The endpoint inherits these project defaults.
  postgres_projects:
    demo_project:
      project_id: ${var.lakebase_project_id}
      pg_version: 17
      # Settings that flow into every auto-created endpoint (including
      # the `primary` endpoint on every branch). 0.5 CU floor is the
      # smallest unit; max of 2 CU keeps demo cost bounded. 300s suspend
      # = 5min idle then scale-to-zero (free). Minimum allowed suspend
      # is 60s; max is 604800s. Wakeup from suspend is a few hundred ms.
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 2
        suspend_timeout_duration: 300s
      lifecycle:
        prevent_destroy: true

  # The demo app itself. It was originally created with `databricks apps
  # create`; declaring it here keeps the resource bindings and the OAuth
  # scopes in source control instead of living only in ad-hoc CLI JSON.
  #
  # `user_api_scopes` is what the on-behalf-of-user token is minted with.
  # Without them the SDK calls made on the user's behalf fail with
  # "Provided OAuth token does not have required scopes":
  #   - serving.serving-endpoints -> `@dbx-tools/model` lists serving
  #     endpoints to resolve an intent (e.g. `chat-balanced`) to a real
  #     endpoint id, so the agent stream 500s without it.
  #   - dashboards.genie          -> the Genie tool queries the Fuel Mart space.
  #   - sql                       -> warehouse queries behind the Genie/SQL tools.
  apps:
    demo_app:
      name: ${var.app_name}
      description: "dbx-tools AppKit + Mastra demo (Fuel Mart)"
      source_code_path: .
      lifecycle:
        prevent_destroy: true
      # Bundle app config overrides app.yaml for the deployed app. Keep the
      # source app.yaml usable as the ordinary local/default app config; the
      # public tunnel, OTP gate, staged client path, and deployment resource
      # bindings belong to this deployment definition instead.
      config:
        # The server registers `tunnelInterceptor()` on its own `createApp`
        # (`@dbx-tools/tunnel`), so the public portr tunnel + OTP gate run
        # IN-PROCESS - the command runs the server directly rather than through a
        # wrapper bin. Gate settings that were CLI flags are env now (see below):
        # `TUNNEL_AUTH_ALLOW` is the old `--allow`.
        command:
          - bun
          - src/server.ts
        env:
          # OTP gate allow-list (was the tunnel CLI's `--allow`). No subject /
          # brand-name override: the defaults are the conventional one-time-code
          # wording ("Your verification code") that iOS, Gmail, Outlook, and
          # Android detect for autofill, and the display name comes from the repo
          # brand context. A novel subject is what breaks that.
          - name: TUNNEL_AUTH_ALLOW
            value: ${var.tunnel_auth_allow}
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: DATABRICKS_GENIE_SPACE_ID
            value_from: genie-space
          - name: LAKEBASE_ENDPOINT
            value: ${var.lakebase_endpoint}
          # The demo is served through the OTP tunnel, where callers authenticate
          # by email and no OBO token exists to forward - `user` would fail every
          # turn with AppKit's AuthenticationError. `auto` keeps OBO for
          # front-door (workspace UI) traffic and falls back to the app service
          # principal per-request for tunnel callers.
          - name: MASTRA_GENIE_IDENTITY
            value: ${var.genie_identity}
          - name: MLFLOW_EXPERIMENT_ID
            value_from: mlflow-experiment
          - name: MLFLOW_TRACKING_URI
            value: ${var.mlflow_tracking_uri}
          - name: OTEL_PROPAGATORS
            value: ${var.otel_propagators}
          - name: SMTP_HOST
            value_from: smtp-host
          - name: SMTP_PORT
            value_from: smtp-port
          - name: SMTP_SECURE
            value_from: smtp-secure
          - name: SMTP_USER
            value_from: smtp-user
          - name: SMTP_PASSWORD
            value_from: smtp-password
          - name: EMAIL_DOMAIN
            value_from: email-domain
          # EMAIL_FROM is deliberately NOT set - see app.yaml. The sender is
          # derived per on-behalf-of user, and system mail (the tunnel's sign-in
          # code) goes out as no-reply@EMAIL_DOMAIN.
          - name: CLIENT_DIST
            value: ${var.client_dist}
          - name: TUNNEL_PUBLIC_DOMAIN
            value: ${var.tunnel_public_domain}
          - name: PORTR_TOKEN
            value_from: portr-token
          # TUNNEL_AUTH_JWT_SECRET is deliberately NOT set: the gate persists its
          # own signing key in the Lakebase-backed AppKit cache for 30 days, so
          # sessions survive the restarts this app sees on every redeploy. Leaving
          # it unset is what dogfoods that path. Set it (from the `auth-jwt-secret`
          # secret) for a multi-instance deployment, where an operator-held secret
          # beats waiting for two instances to converge on a cached key.
          #
          # The `postgres` binding below is what makes that cache persistent, and
          # the gate is a SEPARATE process from the app - it resolves the binding's
          # LAKEBASE_ENDPOINT into PGHOST/PGDATABASE/PGUSER itself at boot. Check
          # the startup log for `lakebase resolved for the gate cache`; a line
          # saying the cache stays in memory means every redeploy signs everyone
          # out again.
      user_api_scopes:
        - sql
        - dashboards.genie
        - serving.serving-endpoints
      resources:
        - name: genie-space
          genie_space:
            name: Fuel Mart Store Intelligence
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        # Lakebase binding that lets autopg mint a working OAuth token as
        # the app service principal. Without it Mastra's PostgresStore init
        # fails with 28P01 password authentication failed and the process
        # exits. The database resource id is hyphenated
        # (`databricks-postgres`); the PG database name is
        # `databricks_postgres`.
        - name: postgres
          postgres:
            branch: projects/${var.lakebase_project_id}/branches/production
            database: projects/${var.lakebase_project_id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
        # MLflow experiment the agent's traces and user feedback land in
        # (`/Users/reggie.pierce@databricks.com/dbx-tools-demo`).
        #
        # This binding is what makes the experiment writable in the deployed
        # app. The experiment's ACL only lists its creator and `admins`, so the
        # app service principal (`app-1glm9d dbx-tools-demo`, in no groups) gets
        # PERMISSION_DENIED without it -- deploying the env var alone is not
        # enough. CAN_EDIT is the lowest level that permits logging; CAN_READ
        # only allows viewing runs and metrics.
        #
        # The matching `valueFrom: mlflow-experiment` in app.yaml resolves to
        # the experiment id, so the id is declared once, here.
        #
        # To also persist OTel spans into the experiment's UC trace location
        # (required for chat turns to show up as MLflow traces - managed MLflow
        # has no OTLP ingest), add `telemetry_export_destinations` on this app
        # pointing at that location's `${target}_otel_{spans,logs,metrics}`
        # tables, set `OTEL_PROPAGATORS=none` (already in app.yaml), and grant
        # the app SP USE_CATALOG / USE_SCHEMA / SELECT / MODIFY. See
        # `@dbx-tools/appkit-mastra` README "Databricks Apps -> Unity Catalog".
        - name: mlflow-experiment
          experiment:
            experiment_id: ${var.experiment_id}
            permission: CAN_EDIT
        # SMTP + sender config for the approval-gated email tool, read from
        # the `dbx-tools-demo` secret scope and surfaced to the runtime by
        # the matching `value_from` entries in the app config above.
        - name: smtp-host
          secret:
            scope: ${var.secret_scope}
            key: smtp-host
            permission: READ
        - name: smtp-port
          secret:
            scope: ${var.secret_scope}
            key: smtp-port
            permission: READ
        - name: smtp-secure
          secret:
            scope: ${var.secret_scope}
            key: smtp-secure
            permission: READ
        - name: smtp-user
          secret:
            scope: ${var.secret_scope}
            key: smtp-user
            permission: READ
        - name: smtp-password
          secret:
            scope: ${var.secret_scope}
            key: smtp-password
            permission: READ
        - name: email-domain
          secret:
            scope: ${var.secret_scope}
            key: email-domain
            permission: READ
        - name: email-from
          secret:
            scope: ${var.secret_scope}
            key: email-from
            permission: READ
        # Public tunnel + OTP gate secrets used only by the deployed command.
        - name: portr-token
          secret:
            scope: ${var.secret_scope}
            key: portr-token
            permission: READ
        - name: auth-jwt-secret
          secret:
            scope: ${var.secret_scope}
            key: auth-jwt-secret
            permission: READ
