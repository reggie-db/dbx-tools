[package]
name = "dbx-tools-databricks-auth"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Databricks OAuth with secure credential storage"
license = { workspace = true }
repository = { workspace = true }

[lib]
name = "dbx_tools_databricks_auth"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "dbx-tools-databricks-auth-uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
dbx-tools-auth = { version = "0.6.174", path = "../auth", default-features = false }
dbx-tools-databricks = { version = "0.6.174", path = "../databricks", default-features = false }
async-trait = { workspace = true }
configparser = { workspace = true }
directories = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
uniffi = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }