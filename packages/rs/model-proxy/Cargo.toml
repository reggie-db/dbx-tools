
[package]
name = "dbx-tools-model-proxy"
description = "Multi-protocol Databricks model proxy"

  [package.version]
  workspace = true

  [package.edition]
  workspace = true

  [package.rust-version]
  workspace = true

  [package.license]
  workspace = true

  [package.repository]
  workspace = true

[[bin]]
name = "dbx-model-proxy"
path = "src/main.rs"

[features]
default = [ "metrics-ui" ]
metrics = [
  "dep:metrics",
  "dep:metrics-exporter-prometheus",
  "dep:hdrhistogram"
]
metrics-ui = [ "metrics", "dep:rust-embed", "dep:mime_guess" ]

[dependencies]
aigw-anthropic = "=0.6.0"
aigw-core = "=0.6.0"
aigw-openai = "=0.6.0"
async-stream = "0.3"
axum = "0.8"
eventsource-stream = "0.2"
futures-util = "0.3"

  [dependencies.backon]
  workspace = true

  [dependencies.base64]
  workspace = true

  [dependencies.clap]
  workspace = true

  [dependencies.dbx-tools-core]
  version = "0.9.5"
  path = "../core"

  [dependencies.dbx-tools-model]
  version = "0.9.5"
  path = "../model"

  [dependencies.hdrhistogram]
  workspace = true
  optional = true

  [dependencies.image]
  workspace = true

  [dependencies.httpdate]
  workspace = true

  [dependencies.metrics]
  workspace = true
  optional = true

  [dependencies.metrics-exporter-prometheus]
  workspace = true
  optional = true

  [dependencies.mime_guess]
  workspace = true
  optional = true

  [dependencies.reqwest]
  workspace = true
  features = [ "stream" ]

  [dependencies.rust-embed]
  workspace = true
  optional = true

  [dependencies.serde]
  workspace = true

  [dependencies.serde_json]
  workspace = true

  [dependencies.thiserror]
  workspace = true

  [dependencies.tokenx-rs]
  workspace = true

  [dependencies.tokio]
  workspace = true

  [dependencies.tracing]
  workspace = true

[dev-dependencies.tempfile]
workspace = true

[dev-dependencies.tokio]
workspace = true
features = [ "test-util" ]

[dev-dependencies.wiremock]
workspace = true
