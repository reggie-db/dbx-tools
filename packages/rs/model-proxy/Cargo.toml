[package]
name = "dbx-tools-model-proxy"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "Multi-protocol Databricks model proxy"
license = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "dbx-model-proxy"
path = "src/main.rs"

[dependencies]
aigw-anthropic = "=0.6.0"
aigw-core = "=0.6.0"
aigw-openai = "=0.6.0"
async-stream = "0.3"
async-trait = { workspace = true }
axum = "0.8"
clap = { workspace = true }
dbx-tools-databricks = { version = "0.6.184", path = "../databricks", default-features = false }
dbx-tools-model = { version = "0.6.184", path = "../model" }
eventsource-stream = "0.2"
futures-util = "0.3"
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tracing = { workspace = true }