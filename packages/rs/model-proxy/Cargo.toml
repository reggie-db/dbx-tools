
[package]
name = "dbx-tools-model-proxy"
default-run = "dbx-model-proxy"
description = "Multi-protocol Databricks model proxy"

  [package.version]
  workspace = true

  [package.edition]
  workspace = true

  [package.rust-version]
  workspace = true

  [package.license]
  workspace = true

  [package.repository]
  workspace = true

[lib]
name = "dbx_tools_model_proxy"
path = "src/lib.rs"

[[bin]]
name = "dbx-model-proxy"
path = "src/main.rs"

[[bin]]
name = "dbx-model-proxy-desktop"
path = "src/bin/desktop.rs"
required-features = [ "desktop" ]

[features]
default = [ "metrics" ]
desktop = [
  "metrics",
  "dep:mime_guess",
  "dep:rspc",
  "dep:rspc-tauri",
  "dep:rust-embed",
  "dep:specta",
  "dep:tauri",
  "dep:dbx-tools-service-desktop",
  "tauri/custom-protocol"
]
desktop-codegen = [ "desktop", "dep:specta-typescript" ]
desktop-debug = [
  "desktop",
  "dep:tauri-plugin-connector",
  "dbx-tools-service-desktop/debug-mcp"
]
metrics = [ "dep:hdrhistogram", "dep:metrics" ]

[[example]]
name = "generate-desktop-bindings"
path = "examples/generate-desktop-bindings.rs"
required-features = [ "desktop-codegen" ]

[dependencies]
aigw-anthropic = "=0.6.0"
aigw-core = "=0.6.0"
aigw-openai = "=0.6.0"
async-stream = "0.3"
axum = "0.8"
eventsource-stream = "0.2"
futures-util = "0.3"

  [dependencies.backon]
  workspace = true

  [dependencies.base64]
  workspace = true

  [dependencies.clap]
  workspace = true

  [dependencies.dbx-tools-core]
  version = "0.9.12"
  path = "../core"

  [dependencies.dbx-tools-model]
  version = "0.9.12"
  path = "../model"

  [dependencies.dbx-tools-service]
  version = "0.9.12"
  path = "../service"

  [dependencies.dbx-tools-service-desktop]
  version = "0.9.12"
  path = "../service-desktop"
  optional = true

  [dependencies.hdrhistogram]
  workspace = true
  optional = true

  [dependencies.image]
  workspace = true

  [dependencies.httpdate]
  workspace = true

  [dependencies.metrics]
  workspace = true
  optional = true

  [dependencies.mime_guess]
  workspace = true
  optional = true

  [dependencies.reqwest]
  workspace = true
  features = [ "stream" ]

  [dependencies.rspc]
  workspace = true
  optional = true

  [dependencies.rspc-tauri]
  workspace = true
  optional = true

  [dependencies.rust-embed]
  workspace = true
  optional = true

  [dependencies.serde]
  workspace = true

  [dependencies.serde_json]
  workspace = true

  [dependencies.sha2]
  workspace = true

  [dependencies.specta]
  workspace = true
  optional = true

  [dependencies.specta-typescript]
  workspace = true
  optional = true

  [dependencies.tauri]
  workspace = true
  optional = true

  [dependencies.tauri-plugin-connector]
  workspace = true
  optional = true

  [dependencies.thiserror]
  workspace = true

  [dependencies.tokenx-rs]
  workspace = true

  [dependencies.tokio]
  workspace = true

  [dependencies.tokio-util]
  workspace = true

  [dependencies.tracing]
  workspace = true

[dev-dependencies.tempfile]
workspace = true

[dev-dependencies.tokio]
workspace = true
features = [ "test-util" ]

[dev-dependencies.wiremock]
workspace = true

[build-dependencies.tauri-build]
workspace = true
