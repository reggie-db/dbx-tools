
[package]
name = "dbx-tools-model-proxy"
default-run = "dbx-model-proxy"
description = "Multi-protocol Databricks model proxy"

  [package.version]
  workspace = true

  [package.edition]
  workspace = true

  [package.rust-version]
  workspace = true

  [package.license]
  workspace = true

  [package.repository]
  workspace = true

[[bin]]
name = "dbx-model-proxy"
path = "src/main.rs"

[[bin]]
name = "dbx-model-proxy-tray"
path = "src/bin/tray.rs"
required-features = [ "tray" ]

[features]
default = [ "metrics" ]
metrics = [ "dep:hdrhistogram", "dep:metrics" ]
tray = [ "dbx-tools-service/tray" ]

[dependencies]
aigw-anthropic = "=0.6.0"
aigw-core = "=0.6.0"
aigw-openai = "=0.6.0"
async-stream = "0.3"
eventsource-stream = "0.2"
futures-util = "0.3"

  [dependencies.aide]
  workspace = true

  [dependencies.async-graphql]
  workspace = true

  [dependencies.axum]
  workspace = true

  [dependencies.axum-typed-routing]
  workspace = true

  [dependencies.backon]
  workspace = true

  [dependencies.base64]
  workspace = true

  [dependencies.clap]
  workspace = true

  [dependencies.dbx-tools-core]
  version = "0.9.17"
  path = "../core"

  [dependencies.dbx-tools-model]
  version = "0.9.17"
  path = "../model"

  [dependencies.dbx-tools-service]
  version = "0.9.17"
  path = "../service"
  features = [ "graphql", "openapi", "topics" ]

  [dependencies.hdrhistogram]
  workspace = true
  optional = true

  [dependencies.image]
  workspace = true

  [dependencies.httpdate]
  workspace = true

  [dependencies.metrics]
  workspace = true
  optional = true

  [dependencies.open]
  workspace = true

  [dependencies.reqwest]
  workspace = true
  features = [ "blocking", "stream" ]

  [dependencies.schemars]
  workspace = true

  [dependencies.serde]
  workspace = true

  [dependencies.serde_json]
  workspace = true

  [dependencies.sha2]
  workspace = true

  [dependencies.thiserror]
  workspace = true

  [dependencies.tokenx-rs]
  workspace = true

  [dependencies.tokio]
  workspace = true

  [dependencies.tracing]
  workspace = true

[dev-dependencies.tempfile]
workspace = true

[dev-dependencies.tokio]
workspace = true
features = [ "test-util" ]

[dev-dependencies.wiremock]
workspace = true
