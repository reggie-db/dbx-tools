
[package]
name = "dbx-tools-service"
description = "Reusable per-user service lifecycle, SQLite state, and companion autostart"

  [package.version]
  workspace = true

  [package.edition]
  workspace = true

  [package.rust-version]
  workspace = true

  [package.license]
  workspace = true

  [package.repository]
  workspace = true

[lib]
name = "dbx_tools_service"
path = "src/lib.rs"

[features]
desktop = [ "dep:open", "dep:tao", "dep:tray-icon", "dep:wry" ]

[dependencies.auto-launcher]
workspace = true

[dependencies.clap]
workspace = true

[dependencies.directories]
workspace = true

[dependencies.open]
workspace = true
optional = true

[dependencies.reqwest]
workspace = true
features = [ "blocking" ]

[dependencies.rusqlite]
workspace = true

[dependencies.rusqlite_migration]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.serde_json]
workspace = true

[dependencies.service-manager]
workspace = true

[dependencies.tray-icon]
version = "=0.25.1"
optional = true
default-features = false
features = [ "ksni" ]

[target."cfg(target_os = \"windows\")".dependencies.sysinfo]
workspace = true

[target."cfg(any(target_os = \"macos\", target_os = \"windows\"))".dependencies.tao]
version = "=0.37.1"
optional = true
default-features = false
features = [ "rwh_06" ]

[target."cfg(any(target_os = \"macos\", target_os = \"windows\"))".dependencies.wry]
version = "=0.56.0"
optional = true
default-features = false
features = [ "os-webview" ]

[dev-dependencies.tempfile]
workspace = true
