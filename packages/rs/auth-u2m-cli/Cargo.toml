[package]
name = "dbx-tools-auth-u2m-cli"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
description = "CLI for dbx-tools-auth-u2m"
license = { workspace = true }
repository = { workspace = true }

[[bin]]
name = "dbx-tools-auth"
path = "src/main.rs"

[features]
default = ["keyring"]
keyring = ["dbx-tools-auth-u2m/keyring"]
postgres = ["dep:async-trait", "dep:sha2", "dep:sqlx"]

[dependencies]
async-trait = { workspace = true, optional = true }
clap = { workspace = true }
dbx-tools-auth-u2m = { version = "0.6.151", path = "../auth-u2m", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
time = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }