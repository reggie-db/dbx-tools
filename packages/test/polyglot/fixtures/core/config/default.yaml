description: Layered configuration behavior shared by TypeScript and Python.
modules:
  typescript: ./config.ts
  python: config_adapter
functions:
  configName:
    path:
      typescript: configName
      python: config_name
  environmentText:
    path:
      typescript: environmentText
      python: environment_text
  configString:
    path:
      typescript: configString
      python: config_string
  configBoolean:
    path:
      typescript: configBoolean
      python: config_boolean
  configPositiveNumber:
    path:
      typescript: configPositiveNumber
      python: config_positive_number
  configPositiveInt:
    path:
      typescript: configPositiveInt
      python: config_positive_int
  configList:
    path:
      typescript: configList
      python: config_list
  isDatabricksAppEnv:
    path:
      typescript: isDatabricksAppEnv
      python: is_databricks_app_env
  dotenvValues:
    path:
      typescript: dotenvValues
      python: dotenv_values
  dotenvCachedValue:
    path:
      typescript: dotenvCachedValue
      python: dotenv_cached_value
  bundleValues:
    path:
      typescript: bundleValues
      python: bundle_values
