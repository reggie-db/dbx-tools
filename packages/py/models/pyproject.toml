# ~~ Generated by projen. To modify, edit .projenrc.js and run "bunx projen".

[project]
name = "dbx-tools-models"
version = "0.9.22"
description = "Python access to Node-owned Databricks model discovery, selection, routing, and metadata"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
  "pythonmonkey>=1.3,<2"
]

  [project.urls]
  Source = "https://github.com/reggie-db/dbx-tools/tree/main/packages/py/models"

[build-system]
requires = [ "uv_build>=0.11.28,<0.12.0" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbx_tools.models"
module-root = "generated-src"
namespace = true

[tool.dbx_tools.node_bindings]
package = "@dbx-tools/model"
entrypoint = "@dbx-tools/model/python"
layout = "package"
shim_root = "projen/shims/python-node"

  [[tool.dbx_tools.node_bindings.function_overrides]]
  module = "@dbx-tools/core/file-lock"
  export = "acquireFileLock"
  handler = "projen/shims/python-node/file-lock.ts"
