[project]
name = "dbx-tools-graphiti"
version = "0.9.42"
description = "Pinned Graphiti MCP adapter for Node-owned FalkorDB and model-gateway"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
  "httpx>=0.28,<1",
  "pythonmonkey>=1.3,<2",
  "graphiti-core[falkordb]==0.29.3",
  "mcp>=1.27.2,<2",
  "openai>=2.41.0",
  "pydantic-settings>=2,<3",
  "pyyaml>=6.0.3,<7",
  "typing-extensions>=4"
]

  [project.urls]
  Source = "https://github.com/reggie-db/dbx-tools/tree/main/packages/py/graphiti"

[build-system]
requires = [ "uv_build>=0.11.28,<0.12.0" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbx_tools.graphiti"
module-root = "src"
namespace = true

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/model"
modules = [ "bindings" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/shared-graphiti"
modules = [ "options" ]
