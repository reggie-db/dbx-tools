[project]
name = "dbx-tools-graphiti"
version = "0.9.47"
description = "Unified Graphiti REST, MCP, model routing, and PostgreSQL graph runtime"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
  "embedded-postgres>=18.6.3,<19",
  "fastapi>=0.115,<1",
  "graphiti-core==0.30.2",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "openai>=2.41,<3",
  "platformdirs>=4,<5",
  "post-graph>=0.7,<1",
  "pydantic-settings>=2,<3",
  "pythonmonkey>=1.3,<2",
  "pyyaml>=6,<7",
  "typing-extensions>=4,<5",
  "uvicorn>=0.44"
]

  [project.urls]
  Source = "https://github.com/reggie-db/dbx-tools/tree/main/packages/py/graphiti"

[build-system]
requires = [ "uv_build>=0.11.28,<0.12.0" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbx_tools.graphiti"
module-root = "src"
namespace = true

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/shared-core"
modules = [ "bindings" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/shared-model"

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/shared-graphiti"

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/auth"
modules = [ "bindings" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/model"
modules = [ "bindings" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/lakebase"
modules = [ "bindings" ]

[[tool.dbx_tools.sync]]
name = "postgraph"
source = "postgraph-driver @ git+https://github.com/crajah/graphiti.git@4f6d7bc31dd9a84053d4094b382485044448d9c8#subdirectory=graphiti_core/driver"
include = [
  "postgraph_driver.py",
  "record_parsers.py",
  "postgraph/**/*.py"
]

  [tool.dbx_tools.sync.replace]
  "graphiti_core.driver.postgraph" = "dbx_tools.graphiti._generated.sync.postgraph.postgraph"
  "GraphProvider.POSTGRAPH" = '"postgraph"'
  "        embedding_dim: int | None = None,\n    ):" = """
        embedding_dim: int | None = None,
        connection_options: dict[str, Any] | None = None,
    ):"""
  "        self._embedding_dim = embedding_dim or EMBEDDING_DIM" = """
        self._embedding_dim = embedding_dim or EMBEDDING_DIM
        self._connection_options = connection_options or {}"""
  "            self._client = AsyncPostGraph(dsn=self._dsn)" = "            self._client = AsyncPostGraph(dsn=self._dsn, **self._connection_options)"

[[tool.dbx_tools.sync]]
name = "graphiti_server"
source = "graph-service @ git+https://github.com/getzep/graphiti.git@2a85bbbf27f3d0d07dd3a8bf6dc8700c5193c066#subdirectory=server"
include = [ "graph_service/**/*.py" ]

  [tool.dbx_tools.sync.replace]
  "from graph_service." = "from dbx_tools.graphiti._generated.sync.graphiti_server.graph_service."

[[tool.dbx_tools.sync]]
name = "graphiti_mcp"
source = "mcp-server @ git+https://github.com/getzep/graphiti.git@2a85bbbf27f3d0d07dd3a8bf6dc8700c5193c066#subdirectory=mcp_server/src"
include = [
  "graphiti_mcp_server.py",
  "config/**/*.py",
  "models/**/*.py",
  "services/**/*.py",
  "utils/**/*.py"
]

  [tool.dbx_tools.sync.replace]
  "from config." = "from dbx_tools.graphiti._generated.sync.graphiti_mcp.config."
  "from models." = "from dbx_tools.graphiti._generated.sync.graphiti_mcp.models."
  "from services." = "from dbx_tools.graphiti._generated.sync.graphiti_mcp.services."
  "from utils." = "from dbx_tools.graphiti._generated.sync.graphiti_mcp.utils."
