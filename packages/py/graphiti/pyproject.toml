# ~~ Generated by projen. To modify, edit .projenrc.js and run "bunx projen".

[project]
name = "dbx-tools-graphiti"
version = "0.9.114"
description = "Unified Graphiti REST, MCP, model routing, and PostgreSQL graph runtime"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "graphiti-core==0.30.2",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "openai>=2.41,<3",
  "platformdirs>=4,<5",
  "post-graph>=1.8,<2",
  "pydantic-settings>=2,<3",
  "pyyaml>=6,<7",
  "typing-extensions>=4,<5",
  "uvicorn>=0.44",
  "dbx-tools-node-runtime==0.9.114"
]

  [project.urls]
  Source = "https://github.com/reggie-db/dbx-tools/tree/main/packages/py/graphiti"

  [project.optional-dependencies]
  dev = [ "embedded-postgres>=18.6.3,<19", "pythonmonkey==1.3.2" ]

[build-system]
requires = [ "uv_build>=0.11.28,<0.12.0" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbx_tools.graphiti"
module-root = "src"
namespace = true

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/shared-core"
modules = [ "bindings" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/shared-model"

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/shared-graphiti"

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/auth"
modules = [ "bindings" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/model"
modules = [ "bindings" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/lakebase"
modules = [ "bindings" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/postgres"
modules = [ "bindings" ]

[[tool.dbx_tools.sync]]
name = "graphiti_server"
source = "graph-service @ git+https://github.com/getzep/graphiti.git@ba4a9cb32495b6864160616f8dfa2b898f4a500c#subdirectory=server"
include = [ "graph_service/**/*.py" ]

[[tool.dbx_tools.sync]]
name = "graphiti_mcp"
source = "mcp-server @ git+https://github.com/getzep/graphiti.git@ba4a9cb32495b6864160616f8dfa2b898f4a500c#subdirectory=mcp_server/src"
include = [
  "graphiti_mcp_server.py",
  "config/**/*.py",
  "models/**/*.py",
  "services/**/*.py",
  "utils/**/*.py"
]

