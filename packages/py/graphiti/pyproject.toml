[project]
name = "dbx-tools-graphiti"
version = "0.9.34"
description = "Native Graphiti MCP and Neo4j launcher with Databricks models through model-gateway"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
  "cyclopts>=4.11,<6",
  "databricks-sdk>=0.123.0",
  "graphiti-core==0.29.3",
  "honcho>=2,<3",
  "dbx-tools-core",
  "dbx-tools-postgres"
]

  [project.urls]
  Source = "https://github.com/reggie-db/dbx-tools/tree/main/packages/py/graphiti"

  [project.scripts]
  dbx-graphiti = "dbx_tools.graphiti.cli:main"

[build-system]
requires = [ "uv_build>=0.11.28,<0.12.0" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbx_tools.graphiti"
module-root = "src"
namespace = true
