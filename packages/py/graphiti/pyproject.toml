[project]
name = "dbx-tools-graphiti"
version = "0.9.43"
description = "Combined Graphiti REST and MCP FastAPI service"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
  "graph-service @ git+https://github.com/getzep/graphiti.git@2a85bbbf27f3d0d07dd3a8bf6dc8700c5193c066#subdirectory=server",
  "mcp-server @ git+https://github.com/getzep/graphiti.git@2a85bbbf27f3d0d07dd3a8bf6dc8700c5193c066#subdirectory=mcp_server",
  "httpx>=0.28,<1",
  "pythonmonkey>=1.3,<2",
  "uvicorn>=0.44"
]

  [project.urls]
  Source = "https://github.com/reggie-db/dbx-tools/tree/main/packages/py/graphiti"

[build-system]
requires = [ "uv_build>=0.11.28,<0.12.0" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbx_tools.graphiti"
module-root = "src"
namespace = true

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/shared-core"
modules = [ "bindings" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/shared-model"

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/graphiti"
modules = [ "options" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/auth"
modules = [ "bindings" ]

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/model"
modules = [ "bindings" ]
