# ~~ Generated by projen. To modify, edit .projenrc.js and run "bunx projen".

[project]
name = "dbx-tools-model-proxy"
version = "0.9.26"
description = "LiteLLM proxy backed by Node-owned Databricks authentication and dynamic model discovery"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
  "filelock>=3.16,<4",
  "httpx>=0.28,<1",
  "pythonmonkey>=1.3,<2",
  "fastapi>=0.116,<1",
  "hypercorn>=0.17,<1",
  "litellm[proxy]==1.99.0",
  "pillow>=11,<13",
  "pystray==0.19.5"
]

  [project.urls]
  Source = "https://github.com/reggie-db/dbx-tools/tree/main/packages/py/model-proxy"

  [project.scripts]
  dbx-model-proxy = "dbx_tools.model_proxy.cli:main"
  dbx-model-proxy-tray = "dbx_tools.model_proxy.tray:main"

[build-system]
requires = [ "uv_build>=0.11.28,<0.12.0" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbx_tools.model_proxy"
module-root = "src"
namespace = true

[tool.dbx_tools.node_bindings]
package = "@dbx-tools/model"
entrypoint = "@dbx-tools/model/python"
layout = "submodule"
shim_root = "projen/shims/python-node"

  [[tool.dbx_tools.node_bindings.function_overrides]]
  module = "@dbx-tools/core/file-lock"
  export = "acquireFileLock"
  handler = "projen/shims/python-node/file-lock.ts"
