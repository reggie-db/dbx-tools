[project]
name = "dbx-tools-postgres"
version = "0.9.34"
description = "WorkspaceClient-backed Lakebase Postgres resolution, SQLAlchemy engines, advisory locks, and LISTEN/NOTIFY topic bus"
readme = "README.md"
requires-python = ">=3.11,<4"
license = "Apache-2.0"
license-files = [ "LICENSE" ]
dependencies = [
  "httpx>=0.28,<1",
  "pythonmonkey>=1.3,<2",
  "asyncpg>=0.30",
  "databricks-sdk>=0.123.0",
  "greenlet>=3.2",
  "psycopg[binary]>=3.2.9",
  "sqlalchemy>=2.0.41"
]

  [project.urls]
  Source = "https://github.com/reggie-db/dbx-tools/tree/main/packages/py/postgres"

[build-system]
requires = [ "uv_build>=0.11.28,<0.12.0" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbx_tools.postgres"
module-root = "src"
namespace = true

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/auth"

[[tool.dbx_tools.node_bindings]]
package = "@dbx-tools/postgres"
modules = [ "identity" ]
