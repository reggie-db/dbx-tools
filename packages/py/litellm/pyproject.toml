readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "databricks-sdk>=0.63.0",
  "dbx-tools-model @ git+https://github.com/reggie-db/dbx-tools.git@main#subdirectory=packages/py/model",
  "diskcache>=5.6",
  "litellm[proxy]>=1.83.14",
  "pillow>=10.0"
]

  [project.urls]
  Source = "https://github.com/reggie-db/dbx-tools/tree/main/packages/py/litellm"

  [project.scripts]
  dbx-litellm = "dbx_tools.litellm.cli:main"

[build-system]
requires = [ "uv_build>=0.11.28,<0.12.0" ]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "dbx_tools.litellm"
module-root = "src"
namespace = true
