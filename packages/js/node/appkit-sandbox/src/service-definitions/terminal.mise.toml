[hooks]
postinstall = '''
set -eu
runtime="$HOME/.dbx-tools/runtime"
bin="$runtime/bin/ttyd"
version_file="$runtime/ttyd.version"
shell_wrapper="$runtime/bin/dbx-tools-shell"
bashrc="$runtime/bin/dbx-tools-bashrc"
project_bashrc="$runtime/bin/dbx-tools-project-bashrc"
stop_script="$runtime/bin/stop-ttyd"
version="1.7.7"
mkdir -p "$runtime/bin"

case "$(uname -m)" in
  aarch64) checksum="b38acadd89d1d396a0f5649aa52c539edbad07f4bc7348b27b4f4b7219dd4165" ;;
  x86_64) checksum="8a217c968aba172e0dbf3f34447218dc015bc4d5e59bf51db2f2cd12b7be4f55" ;;
  *)
    printf 'Unsupported ttyd architecture: %s\n' "$(uname -m)" >&2
    exit 2
    ;;
esac

if [ ! -x "$bin" ] || [ ! -f "$version_file" ] || [ "$(cat "$version_file")" != "$version" ]; then
  TTYD_VERSION="$version" TTYD_ARCHITECTURE="$(uname -m)" TTYD_CHECKSUM="$checksum" \
    TTYD_DESTINATION="$bin" python3 - <<'PY'
import hashlib
import os
import stat
import urllib.request
from pathlib import Path

version = os.environ["TTYD_VERSION"]
architecture = os.environ["TTYD_ARCHITECTURE"]
url = f"https://github.com/tsl0922/ttyd/releases/download/{version}/ttyd.{architecture}"
with urllib.request.urlopen(url) as response:
    payload = response.read()
if hashlib.sha256(payload).hexdigest() != os.environ["TTYD_CHECKSUM"]:
    raise RuntimeError("ttyd checksum mismatch")
destination = Path(os.environ["TTYD_DESTINATION"])
temporary = destination.with_suffix(".tmp")
temporary.write_bytes(payload)
temporary.chmod(temporary.stat().st_mode | stat.S_IXUSR)
os.replace(temporary, destination)
PY
  printf '%s\n' "$version" >"$version_file"
fi

cat >"$bashrc" <<'EOF'
# Interactive ttyd rc loads the user's shell configuration without login output.
if [ -f "${HOME}/.bashrc" ]; then
  . "${HOME}/.bashrc" >/dev/null 2>&1
fi
EOF

cat >"$shell_wrapper" <<'EOF'
#!/bin/sh
unset BASH_ENV ENV PROMPT_COMMAND
directory="${1:-$HOME}"
case "$directory" in
  "$HOME"|"$HOME"/*) ;;
  *) directory="$HOME" ;;
esac
cd -- "$directory"
if [ -f mise.toml ] || [ -f .mise.toml ]; then
  if [ -x "$HOME/.local/bin/mise" ]; then
    exec /bin/bash --noprofile --rcfile "${HOME}/.dbx-tools/runtime/bin/dbx-tools-project-bashrc" -i
  fi
fi
exec /bin/bash --noprofile --rcfile "${HOME}/.dbx-tools/runtime/bin/dbx-tools-bashrc" -i
EOF

cat >"$project_bashrc" <<'EOF'
if [ -f "${HOME}/.dbx-tools/runtime/bin/dbx-tools-bashrc" ]; then
  . "${HOME}/.dbx-tools/runtime/bin/dbx-tools-bashrc"
fi
eval "$("${HOME}/.local/bin/mise" activate bash)"
EOF

cat >"$stop_script" <<'EOF'
#!/bin/sh
set -eu
runtime="$HOME/.dbx-tools/runtime"
pid_matches() {
  pid_file="$1"
  expected="$2"
  [ -s "$pid_file" ] || return 1
  pid=$(cat "$pid_file")
  [ -r "/proc/$pid/cmdline" ] || return 1
  tr '\0' ' ' <"/proc/$pid/cmdline" | grep -F -- "$expected" >/dev/null
}
stop_pid() {
  pid_file="$1"
  expected="$2"
  if pid_matches "$pid_file" "$expected"; then
    pid=$(cat "$pid_file")
    kill "$pid"
    for _ in $(seq 1 40); do
      kill -0 "$pid" 2>/dev/null || break
      sleep 0.25
    done
  fi
  rm -f "$pid_file"
}
stop_pid "$runtime/ttyd.pid" "$runtime/bin/ttyd"
stop_pid "$runtime/dinotty.pid" "dinotty"
rm -f "$runtime/ttyd.running-version"
EOF

chmod 600 "$bashrc" "$project_bashrc"
chmod 700 "$shell_wrapper" "$stop_script"
'''

[tasks.start]
hide = true
run = '''
set -eu
runtime="$HOME/.dbx-tools/runtime"
bin="$runtime/bin/ttyd"
pid_file="$runtime/ttyd.pid"
legacy_pid_file="$runtime/dinotty.pid"
log_file="$runtime/ttyd.log"
version_file="$runtime/ttyd.version"
running_version_file="$runtime/ttyd.running-version"
shell_wrapper="$runtime/bin/dbx-tools-shell"
stop_script="$runtime/bin/stop-ttyd"

pid_matches() {
  [ -s "$pid_file" ] || return 1
  pid=$(cat "$pid_file")
  [ -r "/proc/$pid/cmdline" ] || return 1
  tr '\0' ' ' <"/proc/$pid/cmdline" | grep -F -- "$bin" >/dev/null
}

version="$(cat "$version_file")"
running_version="$(cat "$running_version_file" 2>/dev/null || true)"
if [ -s "$legacy_pid_file" ] || \
  { [ -s "$pid_file" ] && { [ "$running_version" != "$version" ] || ! pid_matches; }; }; then
  "$stop_script"
fi

if ! pid_matches; then
  nohup "$bin" --interface 127.0.0.1 --port 7681 --writable --url-arg \
    --client-option term=xterm-256color --client-option rendererType=webgl \
    --client-option cursorStyle=bar --client-option copyOnSelect=true \
    --client-option rightClickSelectsWord=true --client-option disableLeaveAlert=true \
    --client-option disableResizeOverlay=true "$shell_wrapper" >"$log_file" 2>&1 </dev/null &
  echo $! >"$pid_file"
  printf '%s\n' "$version" >"$running_version_file"
fi

python3 - 7681 <<'PY'
import socket
import sys
import time

port = int(sys.argv[1])
for _ in range(120):
    try:
        with socket.create_connection(("127.0.0.1", port), timeout=1):
            raise SystemExit(0)
    except OSError:
        time.sleep(0.5)
raise SystemExit("ttyd did not become ready")
PY
'''

[tasks.stop]
hide = true
run = '''"$HOME/.dbx-tools/runtime/bin/stop-ttyd"'''
