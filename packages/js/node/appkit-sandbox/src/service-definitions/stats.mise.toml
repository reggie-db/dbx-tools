[hooks]
postinstall = '''
set -eu
: "${DBX_TOOLS_SERVICE_PATH:?DBX_TOOLS_SERVICE_PATH is required}"
runtime="$HOME/.dbx-tools/runtime"
venv="$runtime/glances"
version_file="$venv/.version"
config="$runtime/glances.conf"
stop_script="$runtime/bin/stop-glances"
version="4.5.6"
mkdir -p "$runtime/bin"

if [ ! -x "$venv/bin/glances" ] || [ ! -f "$version_file" ] || [ "$(cat "$version_file")" != "$version" ]; then
  rm -rf "$venv"
  if command -v uv >/dev/null 2>&1; then
    uv venv --python python3 "$venv"
    uv pip install --python "$venv/bin/python" --no-cache "glances[web]==$version"
  else
    if ! python3 -m venv "$venv"; then
      sudo -n apt-get update
      sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3-venv
      python3 -m venv "$venv"
    fi
    "$venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir \
      "glances[web]==$version"
  fi
  printf '%s\n' "$version" >"$version_file"
fi

cat >"$config" <<EOF
[global]
webui_allowed_hosts=127.0.0.1,localhost

[outputs]
url_prefix=${DBX_TOOLS_SERVICE_PATH%/}/
EOF

cat >"$stop_script" <<'EOF'
#!/bin/sh
set -eu
runtime="$HOME/.dbx-tools/runtime"
pid_file="$runtime/glances.pid"
if [ -s "$pid_file" ] && kill -0 "$(cat "$pid_file")" 2>/dev/null; then
  kill "$(cat "$pid_file")"
  for _ in $(seq 1 40); do
    kill -0 "$(cat "$pid_file")" 2>/dev/null || break
    sleep 0.25
  done
fi
rm -f "$pid_file" "$runtime/glances.running-version"
EOF
chmod 700 "$stop_script"
'''

[tasks.start]
hide = true
run = '''
set -eu
runtime="$HOME/.dbx-tools/runtime"
venv="$runtime/glances"
pid_file="$runtime/glances.pid"
log_file="$runtime/glances.log"
config="$runtime/glances.conf"
version="$(cat "$venv/.version")"
running_version_file="$runtime/glances.running-version"
stop_script="$runtime/bin/stop-glances"

running_version="$(cat "$running_version_file" 2>/dev/null || true)"
if [ -s "$pid_file" ] && [ "$running_version" != "$version" ]; then
  "$stop_script"
fi
if ! [ -s "$pid_file" ] || ! kill -0 "$(cat "$pid_file")" 2>/dev/null; then
  nohup "$venv/bin/glances" --config "$config" --webserver --bind 127.0.0.1 \
    --port 61208 --disable-autodiscover >"$log_file" 2>&1 </dev/null &
  echo $! >"$pid_file"
  printf '%s\n' "$version" >"$running_version_file"
fi

python3 - 61208 <<'PY'
import socket
import sys
import time

port = int(sys.argv[1])
for _ in range(240):
    try:
        with socket.create_connection(("127.0.0.1", port), timeout=1):
            raise SystemExit(0)
    except OSError:
        time.sleep(0.5)
raise SystemExit("Glances did not become ready")
PY
'''

[tasks.stop]
hide = true
run = '''"$HOME/.dbx-tools/runtime/bin/stop-glances"'''
