[workspace]
members = [
    "crates/dbx-tools-u2m",
    "crates/dbx-tools-u2m-cli",
    "crates/dbx-tools-u2m-postgres",
]
default-members = [
    "crates/dbx-tools-u2m",
    "crates/dbx-tools-u2m-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/reggie-db/dbx-tools"

[workspace.dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
configparser = "3"
directories = "6"
fs4 = { version = "0.13", features = ["tokio"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
