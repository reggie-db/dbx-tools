[package]
name = "dbx-tools-u2m-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Node.js N-API bindings for dbx-tools-u2m"
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["keyring"]
keyring = ["dbx-tools-u2m/keyring"]
postgres = ["dep:dbx-tools-u2m-postgres"]

[dependencies]
dbx-tools-u2m = { path = "../dbx-tools-u2m", default-features = false }
dbx-tools-u2m-postgres = { path = "../dbx-tools-u2m-postgres", optional = true }
napi.workspace = true
napi-derive.workspace = true
time.workspace = true
tokio.workspace = true

[build-dependencies]
napi-build.workspace = true
