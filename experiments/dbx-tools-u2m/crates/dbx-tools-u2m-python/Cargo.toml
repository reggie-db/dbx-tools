[package]
name = "dbx-tools-u2m-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Python PyO3 bindings for dbx-tools-u2m"
license.workspace = true
repository.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
default = ["keyring"]
keyring = ["dbx-tools-u2m/keyring"]
postgres = ["dep:dbx-tools-u2m-postgres"]

[dependencies]
dbx-tools-u2m = { path = "../dbx-tools-u2m", default-features = false }
dbx-tools-u2m-postgres = { path = "../dbx-tools-u2m-postgres", optional = true }
pyo3.workspace = true
time.workspace = true
tokio.workspace = true
