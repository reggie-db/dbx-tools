[package]
name = "dbx-tools-u2m-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI for dbx-tools-u2m"
license.workspace = true
repository.workspace = true

[[bin]]
name = "dbx-tools-u2m"
path = "src/main.rs"

[features]
default = ["keyring"]
keyring = ["dbx-tools-u2m/keyring"]
postgres = ["dep:dbx-tools-u2m-postgres"]

[dependencies]
clap.workspace = true
dbx-tools-u2m = { path = "../dbx-tools-u2m", default-features = false }
dbx-tools-u2m-postgres = { path = "../dbx-tools-u2m-postgres", optional = true }
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
