[project]
name = "dbx-tools-python-workspace"
version = "0.9.70"
requires-python = ">=3.10,<4"
dependencies = [ "dbx-tools-graphiti" ]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
  "pythonmonkey==1.3.2",
  "tomli>=2,<3; python_version < '3.11'"
]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [ "packages/py/graphiti/src/dbx_tools/graphiti/_generated/**" ]

  [tool.ruff.lint]
  per-file-ignores = { }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [ "packages/py" ]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

  [tool.uv.workspace]
  members = [ "packages/py/*" ]

[tool.uv.sources.dbx-tools-node-runtime]
workspace = true

[tool.uv.sources.dbx-tools-graphiti]
workspace = true
