[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/py"]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[tool.uv.workspace]
members = ["packages/py/*"]

[tool.uv.sources.dbx-tools-auth]
workspace = true

[tool.uv.sources.dbx-tools-databricks]
workspace = true

[tool.uv.sources.dbx-tools-databricks-auth]
workspace = true

[tool.uv.sources.dbx-tools-google-auth]
workspace = true

[tool.uv.sources.dbx-tools-core]
workspace = true

[tool.uv.sources.dbx-tools-postgres]
workspace = true

[tool.uv.sources.dbx-tools-model]
workspace = true

[tool.uv.sources.dbx-tools-litellm]
workspace = true

[tool.uv.sources.dbx-tools-graphiti]
workspace = true

