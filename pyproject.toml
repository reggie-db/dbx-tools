[project]
name = "dbx-tools-python-workspace"
version = "0.6.187"
requires-python = ">=3.11,<4"
dependencies = ["dbx-tools-graphiti"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "pyyaml>=6.0,<7", "ruff>=0.12,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"packages/py/postgres/src/dbx_tools/postgres/topic_bus.py" = ["BLE001"]
"packages/example/notebooks/*.py" = ["BLE001", "F821"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/py"]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

[tool.uv.workspace]
members = ["packages/py/*"]

[tool.uv.sources.dbx-tools-core-rs]
workspace = true

[tool.uv.sources.dbx-tools-google-rs]
workspace = true

[tool.uv.sources.dbx-tools-core]
workspace = true

[tool.uv.sources.dbx-tools-postgres]
workspace = true

[tool.uv.sources.dbx-tools-graphiti]
workspace = true

[tool.pyrefly]
ignore-errors-in-generated-code = true
project-excludes = ["packages/py/core-rs/src/dbx_tools/core_rs/bindings.py", "packages/py/core-rs/src/dbx_tools/core_rs/__init__.py", "packages/py/google-rs/src/dbx_tools/google_rs/bindings.py", "packages/py/google-rs/src/dbx_tools/google_rs/__init__.py"]
