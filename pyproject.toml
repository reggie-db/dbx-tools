# ~~ Generated by projen. To modify, edit .projenrc.ts and run "bunx projen".

[project]
name = "dbx-tools-python-workspace"
version = "0.9.39"
requires-python = ">=3.11,<4"
dependencies = [ "dbx-tools-graphiti" ]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1"
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"packages/py/postgres/src/dbx_tools/postgres/topic_bus.py" = [ "BLE001" ]
"packages/example/notebooks/*.ipynb" = [ "BLE001", "F821" ]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [ "packages/py" ]

[tool.uv]
package = false
index-strategy = "unsafe-best-match"

  [tool.uv.workspace]
  members = [ "packages/py/*" ]

[tool.uv.sources.dbx-tools-core]
workspace = true

[tool.uv.sources.dbx-tools-postgres]
workspace = true

[tool.uv.sources.dbx-tools-graphiti]
workspace = true

[tool.pyrefly]
ignore-errors-in-generated-code = true
project-excludes = [ "packages/py/postgres/src/dbx_tools/postgres/_generated/**" ]
