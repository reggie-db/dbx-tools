command: ["npm", "run", "start"]
env:
  - name: DATABRICKS_GENIE_SPACE_ID
    valueFrom: genie-space
  - name: LAKEBASE_ENDPOINT
    valueFrom: postgres
  # MLflow experiment for agent traces and user feedback. `valueFrom` on an
  # experiment resource resolves to the experiment id, so the id itself lives
  # only in databricks.yml. `MLFLOW_TRACKING_URI=databricks` points the MLflow
  # SDK at this workspace; the host and service-principal credentials are
  # injected by the Apps runtime.
  - name: MLFLOW_EXPERIMENT_ID
    valueFrom: mlflow-experiment
  - name: MLFLOW_TRACKING_URI
    value: databricks
  # SMTP for the approval-gated `send_email` tool. The values live in the
  # `dbx-tools-demo` Databricks secret scope so no credential is committed
  # here; grant the app's service principal READ on that scope.
  - name: SMTP_HOST
    valueFrom: smtp-host
  - name: SMTP_PORT
    valueFrom: smtp-port
  - name: SMTP_SECURE
    valueFrom: smtp-secure
  - name: SMTP_USER
    valueFrom: smtp-user
  - name: SMTP_PASSWORD
    valueFrom: smtp-password
  - name: EMAIL_DOMAIN
    valueFrom: email-domain
  - name: EMAIL_FROM
    valueFrom: email-from
