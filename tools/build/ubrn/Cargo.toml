[package]
name = "dbx-tools-ubrn"
version = "0.0.0"
edition = "2021"
rust-version = "1.89"
license = "MPL-2.0"

[[bin]]
name = "dbx-tools-ubrn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
askama = "=0.13.1"
camino = "1.1.6"
cargo_metadata = "0.19.2"
dunce = "1.0.5"
extend = "1.2.0"
glob = "0.3.1"
heck = "0.5.0"
paste = "1.0.14"
path-slash = "0.2.1"
rcgen = "0.14"
serde-toml-merge = "=0.3.9"
serde_yaml = "0.9.34"
textwrap = "0.16.1"
topological-sort = "0.2.2"
tokio-postgres = "0.7"
uniffi_bindgen = "=0.31.0"
uniffi_meta = "=0.31.0"
which = "6.0.1"
wiremock = "=0.6.5"

[dependencies.clap]
version = "=4.6.0"
features = ["derive"]

[dependencies.globset]
version = "0.4.14"
features = ["serde1"]

[dependencies.pathdiff]
version = "0.2.1"
features = ["camino"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.117"
features = ["preserve_order"]

[dependencies.toml]
version = "0.8.22"
features = ["display"]
